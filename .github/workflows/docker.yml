# Сборка runtime images и публикация только exact versioned release tag.
# Дополнительные registry secrets не нужны: используется GITHUB_TOKEN при permissions packages: write.
name: Docker

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/sports-probabilistic-forecasting-<target>
  IMAGE_BASENAME: sports-probabilistic-forecasting

jobs:
  verify:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --python 3.12 --group dev

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Dependency audit
        run: make security

      - name: Verify release documentation is in tagged commit
        if: github.ref_type == 'tag'
        run: |
          test -f docs/product/requirements/REQ-012-nhl-source-state-archive.md
          test -f docs/product/requirements/REQ-015-worker-runtime-dependency-v1-1-5.md
          test -f docs/product/requirements/REQ-016-production-compose-contract-v1-1-6.md
          test -f docs/architecture/adr/ADR-012-nhl-source-state-archive.md
          test -f docs/architecture/adr/ADR-015-production-compose-model-bind-mount.md
          test -f docs/operations/canonical-bootstrap.md
          test -f docs/operations/production-handoff.md
          test -f docs/backlog/tasks/TASK-012-1-nhl-source-state-contract.md
          test -f docs/backlog/tasks/TASK-012-3-worker-runtime-dependency-v1-1-5.md
          test -f docs/backlog/tasks/TASK-012-4-production-compose-contract-v1-1-6.md
          test -z "$(git status --porcelain)"
          ! git log -1 --format=%s | grep -Eiq 'release evidence|image evidence'

      - name: Filesystem and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify rendered production Compose contract
        run: |
          fixture_root="${RUNNER_TEMP}/production-compose-gate"
          app_version="$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          uv run python scripts/build_production_compose_env_fixture.py \
            --output "$fixture_root/production.env" \
            --root "$fixture_root" \
            --app-version "$app_version"
          docker compose --env-file "$fixture_root/production.env" -f docker-compose.prod.yml --profile migration --profile worker --profile source-acquisition --profile operational-sync config --quiet
          docker compose --env-file "$fixture_root/production.env" -f docker-compose.prod.yml --profile migration --profile worker --profile source-acquisition --profile operational-sync config > "$fixture_root/rendered.yml"
          uv run python scripts/verify_production_compose_contract.py \
            --rendered "$fixture_root/rendered.yml" \
            --model-runtime-root "$fixture_root/runtime_models"

      - name: Verify final Worker model mount and staged artifacts
        run: |
          docker build --target worker --tag sports-forecast-worker-release-gate .
          fixture_root="${RUNNER_TEMP}/worker-runtime-gate"
          app_version="$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          uv run python scripts/build_worker_runtime_gate_fixtures.py \
            --output-root "$fixture_root" --app-version "$app_version"
          source_bundle="$(find "$fixture_root/source-state" -type d -name 'sha256:*' -print -quit)"
          bootstrap_bundle="$(find "$fixture_root/canonical-bootstrap" -type d -name 'sha256:*' -print -quit)"
          model_runtime_root="$fixture_root/runtime_models"
          test -n "$source_bundle"
          test -n "$bootstrap_bundle"
          test -L "$model_runtime_root/current"
          docker run --rm --read-only --network none --user 10001:10001 \
            --entrypoint id sports-forecast-worker-release-gate -u | grep -Fx '10001'
          docker run --rm --read-only --network none --user 10001:10001 \
            --entrypoint id sports-forecast-worker-release-gate -g | grep -Fx '10001'
          docker run --rm --read-only --network none --user 10001:10001 \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --mount type=bind,src="$source_bundle",dst="/fixtures/source-state/${source_bundle##*/}",readonly \
            --mount type=bind,src="$bootstrap_bundle",dst="/fixtures/canonical-bootstrap/${bootstrap_bundle##*/}",readonly \
            --mount type=bind,src="$model_runtime_root",dst=/app/models,readonly \
            --env "SF_APP_VERSION=$app_version" \
            --entrypoint python sports-forecast-worker-release-gate -c '
          from pathlib import Path
          from importlib.util import find_spec
          from sports_forecast.deploy.archive_sync import sync_operational_archive
          from sports_forecast.deploy.canonical_bootstrap import verify_nhl_bootstrap_bundle
          from sports_forecast.deploy.model_bundle import load_current_model_bundle
          from sports_forecast.deploy.source_state import verify_nhl_source_state_bundle
          from sports_forecast.predict import load_model_from_path
          from omegaconf import OmegaConf
          import pandas as pd
          source_bundle = next(Path("/fixtures/source-state").iterdir())
          bootstrap_bundle = next(Path("/fixtures/canonical-bootstrap").iterdir())
          runtime_models = Path("/app/models")
          assert verify_nhl_source_state_bundle(source_bundle).artifact_id == source_bundle.name
          assert verify_nhl_bootstrap_bundle(bootstrap_bundle).artifact_id == bootstrap_bundle.name
          assert (runtime_models / "current").is_symlink()
          assert (runtime_models / "current").resolve().parent.name == "bundles"
          assert load_current_model_bundle(runtime_models, app_version=__import__("os").environ["SF_APP_VERSION"]).bundle_id == (runtime_models / "current").resolve().name
          model_dir = runtime_models / "current"
          model = load_model_from_path(OmegaConf.load("/app/conf/algorithm/catboost_reg.yaml"), model_dir / "fixture_prod.cbm")
          assert model.predict_proba(pd.DataFrame({"weekday": [1]})).shape == (1, 2)
          try:
              (runtime_models / "write-probe").write_text("forbidden", encoding="utf-8")
          except OSError:
              pass
          else:
              raise AssertionError("model mount must be read-only")
          assert callable(sync_operational_archive)
          assert find_spec("mlflow") is None
          assert find_spec("dvc") is None
          assert find_spec("optuna") is None
          '

  first-rollout:
    needs: [verify, build-artifacts]
    uses: ./.github/workflows/production-first-rollout-contract.yml
    permissions:
      contents: read

  build-artifacts:
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
          - target: worker
          - target: telegram-bot
          - target: archive-sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.0.0
      - name: Build Docker image archive once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.0.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          outputs: type=docker,dest=/tmp/${{ matrix.target }}.docker.tar,name=sf-rollout-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload Docker image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-oci-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}.docker.tar
          if-no-files-found: error

  build-push:
    needs: [verify, build-artifacts, first-rollout]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            tested_digest: ${{ needs.first-rollout.outputs.api_digest }}
          - target: worker
            tested_digest: ${{ needs.first-rollout.outputs.worker_digest }}
          - target: telegram-bot
            tested_digest: ${{ needs.first-rollout.outputs.bot_digest }}
          - target: archive-sync
            tested_digest: ${{ needs.first-rollout.outputs.archive_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Validate release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Download tested Docker image archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-oci-${{ matrix.target }}
          path: artifacts/release-oci

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR image name
        id: image-name
        run: >-
          echo "value=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}-${{ matrix.target }}"
          >> "$GITHUB_OUTPUT"

      - name: Load, publish and verify tested artifact
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          TESTED_DIGEST: ${{ matrix.tested_digest }}
        run: |
          docker load --input artifacts/release-oci/${{ matrix.target }}.docker.tar
          docker tag sf-rollout-${{ matrix.target }}:${GITHUB_SHA} "${IMAGE_NAME}:${GITHUB_REF_NAME#v}"
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME#v}"
          published_digest="$(docker buildx imagetools inspect --format '{{json .}}' "${IMAGE_NAME}:${GITHUB_REF_NAME#v}" | jq --exit-status --raw-output '.manifest.digest')"
          test "$published_digest" = "$TESTED_DIGEST"
          echo "digest=$published_digest" >> "$GITHUB_OUTPUT"

      - name: Verify published runtime manifest platform
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image_ref"
          docker buildx imagetools inspect --format '{{json .}}' "$image_ref" \
            | jq --exit-status -e '
              (.manifest.mediaType | test("image\.manifest|image\.index|manifest\.v2"))
              and ((.image.os == "linux" and .image.architecture == "amd64")
                or any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64"))
            '

      - name: Smoke Worker runtime reference
        if: matrix.target == 'worker'
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          worker_image="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$worker_image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$worker_image")" = 'linux/amd64'
          docker run --rm --platform linux/amd64 --network none --read-only --user 10001:10001 \
            --entrypoint python "$worker_image" -c '
              from sports_forecast.deploy.archive_sync import sync_operational_archive
              from sports_forecast.deploy.canonical_bootstrap import verify_nhl_bootstrap_bundle
              from sports_forecast.deploy.source_state import verify_nhl_source_state_bundle
              assert callable(sync_operational_archive)
              assert callable(verify_nhl_bootstrap_bundle)
              assert callable(verify_nhl_source_state_bundle)
            '

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-name.outputs.value }}@${{ steps.publish.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image-name.outputs.value }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Publish release evidence
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "### Release image evidence"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo "- image: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

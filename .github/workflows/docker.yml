# Сборка runtime images и публикация только exact versioned release tag.
# Дополнительные registry secrets не нужны: используется GITHUB_TOKEN при permissions packages: write.
name: Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/sports-probabilistic-forecasting-<target>
  IMAGE_BASENAME: sports-probabilistic-forecasting

jobs:
  verify:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --python 3.12 --group dev

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Dependency audit
        run: make security

      - name: Verify release documentation is in tagged commit
        if: github.ref_type == 'tag'
        run: |
          test -f docs/product/requirements/REQ-012-nhl-source-state-archive.md
          test -f docs/product/requirements/REQ-015-worker-runtime-dependency-v1-1-5.md
          test -f docs/product/requirements/REQ-016-production-compose-contract-v1-1-6.md
          test -f docs/architecture/adr/ADR-012-nhl-source-state-archive.md
          test -f docs/architecture/adr/ADR-015-production-compose-model-bind-mount.md
          test -f docs/operations/canonical-bootstrap.md
          test -f docs/operations/production-handoff.md
          test -f docs/backlog/tasks/TASK-012-1-nhl-source-state-contract.md
          test -f docs/backlog/tasks/TASK-012-3-worker-runtime-dependency-v1-1-5.md
          test -f docs/backlog/tasks/TASK-012-4-production-compose-contract-v1-1-6.md
          test -z "$(git status --porcelain)"
          ! git log -1 --format=%s | grep -Eiq 'release evidence|image evidence'

      - name: Filesystem and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify rendered production Compose contract
        run: |
          fixture_root="${RUNNER_TEMP}/production-compose-gate"
          app_version="$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          uv run python scripts/build_production_compose_env_fixture.py \
            --output "$fixture_root/production.env" \
            --root "$fixture_root" \
            --app-version "$app_version"
          docker compose --env-file "$fixture_root/production.env" -f docker-compose.prod.yml --profile worker --profile source-acquisition --profile operational-sync config --quiet
          docker compose --env-file "$fixture_root/production.env" -f docker-compose.prod.yml --profile worker --profile source-acquisition --profile operational-sync config > "$fixture_root/rendered.yml"
          uv run python scripts/verify_production_compose_contract.py \
            --rendered "$fixture_root/rendered.yml" \
            --model-runtime-root "$fixture_root/runtime_models"

      - name: Verify final Worker model mount and staged artifacts
        run: |
          docker build --target worker --tag sports-forecast-worker-release-gate .
          fixture_root="${RUNNER_TEMP}/worker-runtime-gate"
          app_version="$(uv run python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          uv run python scripts/build_worker_runtime_gate_fixtures.py \
            --output-root "$fixture_root" --app-version "$app_version"
          source_bundle="$(find "$fixture_root/source-state" -type d -name 'sha256:*' -print -quit)"
          bootstrap_bundle="$(find "$fixture_root/canonical-bootstrap" -type d -name 'sha256:*' -print -quit)"
          model_runtime_root="$fixture_root/runtime_models"
          test -n "$source_bundle"
          test -n "$bootstrap_bundle"
          test -L "$model_runtime_root/current"
          docker run --rm --read-only --network none --user 10001:10001 \
            --entrypoint id sports-forecast-worker-release-gate -u | grep -Fx '10001'
          docker run --rm --read-only --network none --user 10001:10001 \
            --entrypoint id sports-forecast-worker-release-gate -g | grep -Fx '10001'
          docker run --rm --read-only --network none --user 10001:10001 \
            --mount type=bind,src="$source_bundle",dst="/fixtures/source-state/${source_bundle##*/}",readonly \
            --mount type=bind,src="$bootstrap_bundle",dst="/fixtures/canonical-bootstrap/${bootstrap_bundle##*/}",readonly \
            --mount type=bind,src="$model_runtime_root",dst=/app/models,readonly \
            --env "SF_APP_VERSION=$app_version" \
            --entrypoint python sports-forecast-worker-release-gate -c '
          from pathlib import Path
          from importlib.util import find_spec
          from sports_forecast.deploy.archive_sync import sync_operational_archive
          from sports_forecast.deploy.canonical_bootstrap import verify_nhl_bootstrap_bundle
          from sports_forecast.deploy.model_bundle import load_current_model_bundle
          from sports_forecast.deploy.source_state import verify_nhl_source_state_bundle
          source_bundle = next(Path("/fixtures/source-state").iterdir())
          bootstrap_bundle = next(Path("/fixtures/canonical-bootstrap").iterdir())
          runtime_models = Path("/app/models")
          assert verify_nhl_source_state_bundle(source_bundle).artifact_id == source_bundle.name
          assert verify_nhl_bootstrap_bundle(bootstrap_bundle).artifact_id == bootstrap_bundle.name
          assert (runtime_models / "current").is_symlink()
          assert (runtime_models / "current").resolve().parent.name == "bundles"
          assert load_current_model_bundle(runtime_models, app_version=__import__("os").environ["SF_APP_VERSION"]).bundle_id == (runtime_models / "current").resolve().name
          try:
              (runtime_models / "write-probe").write_text("forbidden", encoding="utf-8")
          except OSError:
              pass
          else:
              raise AssertionError("model mount must be read-only")
          assert callable(sync_operational_archive)
          assert find_spec("mlflow") is None
          assert find_spec("dvc") is None
          assert find_spec("optuna") is None
          '

  build-push:
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
          - target: worker
          - target: telegram-bot
          - target: archive-sync
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR image name
        id: image-name
        run: >-
          echo "value=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_BASENAME}-${{ matrix.target }}"
          >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image-name.outputs.value }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-name.outputs.value }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image-name.outputs.value }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish release evidence
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Release image evidence"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo "- image: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

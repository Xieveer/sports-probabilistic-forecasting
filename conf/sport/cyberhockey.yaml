# Sport: Cyberhockey (Esports)
# Общая конфигурация для всех киберхоккейных турниров (UEL KZ, UEL CZ и т.д.)
#
# Содержит:
#   - target_sources: как вычислять таргеты (один тип счёта — голы)
#   - allowed_market_specs: допустимые рынки и линии
#   - data_clean: стандартный column_mapping, dtype_mapping
#   - form_params: дефолтные пороги FG/DP (override на уровне турнира)

sport: cyberhockey

# ============================================================================
# ROLLING (EWM / Count): какие контексты из context_library.yaml включать
# ============================================================================
# Полный набор: есть pl_cteam / opp_cteam (консольная команда) — контексты team / h2h_team включены.
# Список совпадает с canonical_order в context_library.yaml.
rolling_context_names:
  - global
  - match_state
  - match_num
  - weekday
  - tour_num
  - tour_side
  - form
  - team
  - h2h_global
  - h2h_match_state
  - h2h_match_num
  - h2h_side
  - h2h_form
  - h2h_team

# ============================================================================
# FORM PARAMS (бизнес-логика формы — overridable на уровне турнира)
# ============================================================================
form_params:
  fg_trigger_minutes: 480   # 8 часов → First Game
  dp_trigger_minutes: 30    # 30 минут → Double Play

# ============================================================================
# ДОПУСТИМЫЕ MARKET SPECS
# ============================================================================
allowed_market_specs:
  winner:
    specs: [winner, winner_home]
  total:
    # Киберхоккей: тоталы в диапазоне 3-10 голов
    lines: [3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5]
    specs: [total_over, total_under]

# ============================================================================
# ОПРЕДЕЛЕНИЕ ТАРГЕТОВ
# ============================================================================
# Киберхоккей: один тип счёта — голы (home_points / away_points)
# Голы определяют и победителя, и тотал.
target_sources:
  # Winner (long format): pl_points > opp_points
  player_win:
    format: long
    player_column: pl_points
    opponent_column: opp_points
    comparison: greater

  # Winner (wide format): home_points > away_points
  home_win:
    format: wide
    home_column: home_points
    away_column: away_points
    comparison: greater

  # Total Over: (home_points + away_points) > line
  total_sum:
    format: wide
    home_column: home_points
    away_column: away_points
    comparison: total_over

  # Total Under: (home_points + away_points) < line
  total_sum_under:
    format: wide
    home_column: home_points
    away_column: away_points
    comparison: total_under

# ============================================================================
# DATA CLEAN: Общий шаблон для всех киберхоккейных турниров
# ============================================================================
# Турнирный конфиг может добавить select_columns, derived_columns.
data_clean:
  # Маппинг source → стандартные имена
  column_mapping:
    h_m_s: home_points
    a_m_s: away_points
    home_short_name_en: home_team
    away_short_name_en: away_team
    # Консольная команда (Pittsburgh Penguins и т.д.) — используется
    # как контекстная группировка в EWM/Count (team context).
    # В long format: home_cteam → pl_cteam, away_cteam → opp_cteam
    home_team_name_en: home_cteam
    away_team_name_en: away_cteam
    odds_feed: odds_raw

  # Обязательные колонки (status деривируется из match_is_end, не требует наличия в raw)
  required_columns: [id, datetime]

  # Производные колонки (общие для всех турниров спорта)
  # tour_num = время суток турнира (1=ночь, 2=утро, 3=день, 4=вечер)
  derived_columns:
    tour_num:
      source: tour_datetime
      transform: hour_to_time_of_day

  # Колонки для dropna (НЕ включать score-колонки — у upcoming матчей они пусты)
  drop_na_columns: [id, datetime]

  # Колонки счёта (после column_mapping) — для определения status из match_is_end.
  # upcoming = match_is_end != 1 AND все score_columns пусты
  # live (фильтруется) = match_is_end != 1 AND хотя бы один score не пуст
  score_columns: [home_points, away_points]

  # Типизация
  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
    string: [id, status]
    datetime:
      datetime:
        format: null
        errors: coerce

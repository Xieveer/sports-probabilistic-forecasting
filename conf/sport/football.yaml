# Sport: Football (national teams, Smart Tables ingest)
#
# Phase 2: winner (1X2 с ничьей) + total на линиях 1.5/2.5/3.5/4.5.
# Draw-aware 3-class winner — отдельные market_spec в Phase 2; home_win здесь — контракт счёта.

sport: football

feature_pipeline:
  groups:
    nhl_boxscore: false
    streak: false

rolling_context_names:
  - global
  - match_state
  - weekday
  - tour_side
  - form
  - inseason
  - team
  - h2h_global
  - h2h_match_state
  - h2h_side
  - h2h_form
  - h2h_inseason
  - h2h_team

# R44: inseason context library key ``season`` → ``season_id`` в interim.
rolling_column_aliases:
  season: season_id

# R44: EWM по ST stat (period=all); spans короче NHL из‑за редких матчей сборных.
ewm_spans: [3, 10]
ewm_metrics:
  - { metric: goals_all_diff, label: goals_diff }
  - { metric: goals_all_total, label: goals_total }
  - { metric: xg_all_diff, label: xg_diff }
  - { metric: xg_all_total, label: xg_total }
  - { metric: corners_all_diff, label: corners_diff }
  - { metric: corners_all_total, label: corners_total }
  - { metric: possession_all_diff, label: possession_diff }
  - { metric: possession_all_total, label: possession_total }
  - { metric: shotstarget_all_diff, label: shotstarget_diff }
  - { metric: shotstarget_all_total, label: shotstarget_total }

form_params:
  fg_trigger_minutes: 10080   # 7 дней между матчами сборной
  dp_trigger_minutes: 1440    # 24 ч — «двойной» интервал

allowed_market_specs:
  winner:
    specs: [winner, winner_home]
  total:
    lines: [1.5, 2.5, 3.5, 4.5]
    specs: [total_over, total_under]

target_sources:
  # Winner wide: home_points > away_points (ничья → 0; 3-class — Phase 2)
  home_win:
    format: wide
    home_column: home_points
    away_column: away_points
    comparison: greater

  total_sum:
    format: wide
    home_column: home_points
    away_column: away_points
    comparison: total_over

  total_sum_under:
    format: wide
    home_column: home_points
    away_column: away_points
    comparison: total_under

data_clean:
  column_mapping:
    match_id: id
    home_score_ft: home_points
    away_score_ft: away_points
    home_team_name: home_team
    away_team_name: away_team

  required_columns: [id, datetime]
  drop_na_columns: [id, datetime]

  score_columns: [home_points, away_points]

  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
      match_importance: float
      is_friendly: float
      # ST match stats (period=all) — R44; bronze may store as str
      home_goals_all: float
      away_goals_all: float
      home_xg_all: float
      away_xg_all: float
      home_corners_all: float
      away_corners_all: float
      home_possession_all: float
      away_possession_all: float
      home_shotstarget_all: float
      away_shotstarget_all: float
      home_yellowcards_all: float
      away_yellowcards_all: float
    string: [id, status, home_team, away_team, competition_code]
    datetime:
      datetime:
        format: null
        errors: coerce

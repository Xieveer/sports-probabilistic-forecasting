# Time features: извлечение временных признаков из datetime.
#
# TimeFeatureGenerator — пре-генератор: запускается на WIDE данных
# ДО wide→long, а сгенерированные колонки автоматически попадают
# в long_format_context_columns и используются как ключи группировки
# в EWM/Count генераторах.
#
# Поддерживаемые фичи: weekday, hour, is_weekend, time_of_day, month.

time:
  type: "time"
  enabled: true
  datetime_column: "datetime"
  features:
    - weekday
    - hour

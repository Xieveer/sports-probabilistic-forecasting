# NHL: плотность расписания + travel/rest (R22.5), пре-генератор wide → long context
nhl_schedule:
  type: nhl_schedule
  enabled: true
  datetime_column: datetime
  required_columns:
    - home_team
    - away_team
    - datetime
    - home_sog_ft
  travel:
    # Км между ареной предыдущей игры команды и текущей; сдвиг часового пояса (std, без DST).
    enabled: true

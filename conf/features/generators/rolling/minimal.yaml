# Rolling features: минимальный набор для быстрого тестирования.
# EWM с 1 span по обеим метрикам + Count с базовыми контекстами.
# Используется в features/basic.yaml.

ewm_diff:
  type: "ewm"
  enabled: true
  metric: "diff_ps"
  metric_label: "diff"
  spans: [10]
  shift: 1
  min_periods: 3
  adjust: false

  # Warmup-фича: уверенность EWM [0, 1].
  warmup:
    enabled: true
    threshold: 10
    players: ["pl", "opp"]

  contexts:
    # Глобальная форма игрока
    - name: "global"
      keys: ["pl"]
      players: ["pl", "opp"]
      compute_diff: true

    # H2H форма
    - name: "h2h_global"
      keys: ["pl", "opp"]
      h2h: true

ewm_total:
  type: "ewm"
  enabled: true
  metric: "total_ps"
  metric_label: "total"
  spans: [10]
  shift: 1
  min_periods: 3
  adjust: false

  contexts:
    - name: "global"
      keys: ["pl"]
      players: ["pl", "opp"]
      compute_diff: false

    - name: "h2h_global"
      keys: ["pl", "opp"]
      h2h: true

count:
  type: "count"
  enabled: true
  shift: 1

  contexts:
    # Общее количество матчей
    - name: "global"
      keys: ["pl"]
      players: ["pl", "opp"]

    # Количество H2H встреч
    - name: "h2h_global"
      keys: ["pl", "opp"]
      h2h: true

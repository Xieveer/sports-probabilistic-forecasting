# Базовый набор фичей для быстрого тестирования.
# Генерирует ~50 фичей (минимальный набор spans и контекстов).
#
# Композиция:
#   _common        → exclude_cols, result_cols, prefix, requires_long
#   rolling/minimal → ewm (span=10) + count (global + h2h)
#   form/default    → form (fg/dp из tournament конфига)
#   time/default    → long_format_context_columns

defaults:
  - _common
  - generators/rolling@generators: minimal
  - generators/form@generators: default
  - generators/time@generators: default

name: basic
description: "Basic featureset for fast testing"

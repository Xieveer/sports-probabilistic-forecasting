# Общие настройки для всех features конфигов.
# Подключается через defaults в basic.yaml / advanced.yaml.
# Содержит: exclude_cols, result_cols, prefix, requires_long, create_metrics.

# Колонки для исключения из фичей (глобальные)
exclude_cols:
  - id
  - match_id
  - datetime
  - tournament
  - status
  - odds_raw
  # The Odds API (NHL merge) — не входят в обучение; см. docs/cursor/source_data/the_odds_api.md
  - pinnacle_home_open
  - pinnacle_away_open
  - pinnacle_draw_open
  - pinnacle_home_close
  - pinnacle_away_close
  - pinnacle_draw_close
  - pinnacle_total_open
  - pinnacle_total_close

# Колонки с результатами матчей (для защиты от утечек)
result_cols:
  # Long format
  - pl_points
  - opp_points
  - pl_sets
  - opp_sets
  - pl
  - opp
  - diff_ps
  - total_ps
  - goals_full_diff
  - goals_full_total
  - goals_reg_diff
  - goals_reg_total
  - sog_diff_ft
  - bs_diff_ft
  - hits_diff_ft
  - pim2_diff_ft
  - fow_diff_ft
  - pl_goals_full
  - opp_goals_full
  - pl_goals_reg
  - opp_goals_reg
  - pl_sog_ft
  - opp_sog_ft
  - pl_bs_ft
  - opp_bs_ft
  - pl_hits_ft
  - opp_hits_ft
  - pl_2pim_ft
  - opp_2pim_ft
  - pl_fow_ft
  - opp_fow_ft
  # Wide format
  - home_points
  - away_points
  - home_score
  - away_score
  - home_sets
  - away_sets
  - total
  - diff
  # Названия команд/игроков (стандартизированы)
  - home_team
  - away_team

# Префикс для всех генерируемых фичей
feature_prefix: "f_"

# Требуется ли long format для генерации
requires_long: true

# Автоматическое создание базовых метрик
create_metrics:
  - "diff"    # diff_ps = pl_points - opp_points
  - "total"   # total_ps = pl_points + opp_points
  - "goals_full_diff"
  - "goals_full_total"
  - "goals_reg_diff"
  - "goals_reg_total"
  - "sog_diff_ft"
  - "bs_diff_ft"
  - "hits_diff_ft"
  - "pim2_diff_ft"
  - "fow_diff_ft"

# Контекстные колонки для wide→long трансформации.
# TimeFeatureGenerator автоматически добавляет свои колонки (weekday, hour, ...)
# к этому списку, НЕ нужно указывать их здесь.
long_format_context_columns:
  - "tour_num"
  - "tour_match_num"
  - "season"

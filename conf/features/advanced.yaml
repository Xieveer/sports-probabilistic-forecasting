# Продвинутый набор фичей для максимального качества модели.
# Генерирует ~1000+ фичей (полные spans, все контексты).
#
# Композиция:
#   _common          → exclude_cols, result_cols, prefix, requires_long
#   rolling/standard → ewm (spans=[5,25,100]) + count (все контексты)
#   form/default     → form (fg/dp из tournament конфига)
#   time/default     → long_format_context_columns

defaults:
  - _common
  - generators/rolling@generators: standard
  - generators/form@generators: default
  - generators/time@generators: default

name: advanced
description: "Advanced featureset with multiple spans (5, 25, 100)"

# Идентификатор участника (из tournament конфига)
player_id_attr: ${tournament.player_id_attr}

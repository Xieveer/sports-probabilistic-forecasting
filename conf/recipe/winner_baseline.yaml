# Recipe: Winner Baseline
# Базовый набор экспериментов для winner markets

name: winner_baseline
description: "Baseline experiments for winner markets (home/h2h)"

# Какие featuresets пробуем
featuresets:
  - basic      # Базовые фичи
  - advanced   # Продвинутые фичи с множественными spans

# Какие алгоритмы пробуем
algorithms:
  - dummy      # Baseline для сравнения
  - logreg     # Линейная модель
  - catboost   # Gradient boosting
  - lgbm       # Fast gradient boosting

# Стратегия подбора гиперпараметров
hyper: none  # none/grid_small/optuna

# Seeds для воспроизводимости
seeds:
  - 42
  - 777
  - 2024

# TSCV настройки
tscv:
  n_folds: 4
  expanding_window: true

# Recipe: Total Strong
# Продвинутый набор с Optuna оптимизацией для total markets

name: total_strong
description: "Advanced experiments for total with Optuna optimization"

# Featuresets
featuresets:
  - advanced   # Только продвинутые фичи

# Algorithms
algorithms:
  - catboost   # Лучший для тоталов
  - lgbm       # Быстрая альтернатива

# Стратегия гиперпараметров
hyper: optuna  # С оптимизацией!

# Seeds
seeds:
  - 42
  - 777

# TSCV
tscv:
  n_folds: 4
  expanding_window: true



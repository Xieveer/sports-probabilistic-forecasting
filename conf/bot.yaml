# Telegram-бот (aiogram 3). Секреты только из окружения: BOT_TOKEN
#
# Запуск: python -m sports_forecast.bot
# make bot-dev  |  make bot-up (docker compose)
#
# R37.7: для NHL бот дергает GET /predict/upcoming с live_pinnacle (нужен ODDS_API_KEY на **API**,
# не в боте). Отключить live: ``bot.live_pinnacle: false`` или убрать обогащение на стороне API.

defaults:
  - paths
  - _self_

name: telegram_bot
description: "Операционный бот: прогнозы и админ-команды"

bot:
  polling_timeout_sec: 30
  # Базовый URL FastAPI (тот же хост, что видит пользователь сервиса)
  api_base_url: "http://127.0.0.1:8000"
  # Отдельный control credential доступен боту только для защищённых /admin endpoints.
  control_api_key_file: ${oc.env:BOT_CONTROL_API_KEY_FILE, ""}
  # JSON alias → один chat ID; несколько получателей задаются разными aliases.
  notification_destinations_file: ${oc.env:BOT_NOTIFICATION_DESTINATIONS_FILE, ""}
  notification_destinations: {}
  notification_poll_interval_seconds: 10
  # Whitelist: список Telegram user_id (int). Пустой список = доступ запрещён всем.
  # R41: пользователям доступен только /edge,/predict,/upcoming (GET к FastAPI); /refresh только admin_ids.
  allowed_user_ids: []
  admin_user_ids: []
  # Устаревшие Airflow параметры оставлены только для совместимости конфигурации.
  airflow_base_url: ""
  airflow_username: ""
  airflow_password: ""
  airflow_dag_id: "data_refresh"
  # R37.7: запрашивать у API live Pinnacle + edge / bet (см. PredictionResponse); на стороне API нужен ODDS_API_KEY.
  live_pinnacle: true

logging:
  level: INFO

hydra:
  run:
    dir: .
  job:
    chdir: false

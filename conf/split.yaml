# @package split
# Train/Test Split Configuration
# Стратегия разделения данных для обучения и тестирования
#
# После фильтрации по сезонам (см. ``tournament.train_eval_split`` в e.g.
# ``conf/tournament/nhl.yaml``) внутренний train/test по-прежнему задаётся
# долей ``test_size``, если не активен ``kind: season_holdout`` (тогда test = целиком holdout-сезоны).

# Стратегия split
strategy: time_series  # time_series/random/stratified

# Размер test set
test_size: 0.1  # 10% для теста (90% train)

# Временная колонка (для time_series split)
time_column: datetime

# Настройки
shuffle: false          # НЕ перемешиваем для временных рядов!
stratify: null          # НЕ используем stratify для временных рядов

# Seed для воспроизводимости (если shuffle=true)
random_state: 42

# Time Series Cross-Validation
tscv_n_splits: 4  # Количество фолдов для TSCV
tscv_gap: 0       # Разрыв между train и val (в строках)

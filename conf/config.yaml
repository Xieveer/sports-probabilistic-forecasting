# Root Configuration для ML Training Pipeline
# Архитектура v2.0: Market-Algorithm Separation

defaults:
  - paths
  - split
  - calibration
  - metrics
  - mlflow: mlflow

  # Основные компоненты (обязательны через CLI)
  - tournament: ???        # REQUIRED: tournament=uel_kz_1
  - market: ???            # REQUIRED: market=total
  - market_spec: ???       # REQUIRED: market_spec=total_over
  - recipe: ???            # REQUIRED: recipe=total_baseline

  # Компоненты experiment (OPTIONAL: заполняются recipe или CLI)
  - optional algorithm: null  # Заполняется из recipe или CLI
  - optional features: null   # Заполняется из recipe или CLI
  - hyper: none               # По умолчанию без оптимизации

  - _self_

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Seed для воспроизводимости
seed: 42

# Логирование
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

# ============================================================================
# HYDRA SETTINGS
# ============================================================================

hydra:
  run:
    dir: .  # Не создавать outputs/ директорию
  job:
    chdir: false  # Не менять рабочую директорию

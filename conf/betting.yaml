# @package betting
# Betting Simulator Configuration
# Настройки симуляции ставок для бизнес-метрик

# Включить симуляцию ставок
enabled: true

# Начальный банкролл для симуляции
initial_bankroll: 1000.0

# Стратегия ставок
stake_strategy: flat  # flat / kelly

# Размер flat ставки
flat_stake: 10.0

# Доля Kelly (для kelly strategy)
kelly_fraction: 0.25  # quarter Kelly (консервативная)

# Минимальный порог edge для отбора ставки: edge = p_model - p_implied, p_implied = 1/odds
min_edge_threshold: 0.05  # например 5 п.п. вероятности в пользу модели vs линия

# Сохранить CSV построчного trace на test (p_prob, odds, edge, ставка, профит, …)
# в каталог модели и залогировать как MLflow-артефакт.
save_test_bet_trace: true

# Колонки из test_df (holdout), подмешиваемые в test_bet_trace.csv по индексу строки.
# Long NHL: pl/opp — команды строки (ставка на pl), side=h|a, голы с ОТ — pl_goals_full / opp_goals_full.
# Для wide или других турниров переопределите список в своём yaml или задайте [].
test_bet_trace_extra_columns:
  - datetime
  - pl
  - opp
  - side
  - is_home
  - pl_goals_full
  - opp_goals_full
  - match_id
  - id

# Максимальная доля банка на одну ставку (защита от разорения)
max_stake_fraction: 0.1  # 10% от текущего банка

# ============================================================================
# THRESHOLD SWEEP
# ============================================================================
# Прогон на множестве порогов edge для анализа чувствительности (те же единицы, что min_edge_threshold).
# Результат — CSV-артефакт в MLflow + ключевые пороги как метрики.
threshold_sweep:
  enabled: true
  min: 0.0    # Начальный порог edge
  max: 0.30   # Максимальный порог edge
  step: 0.01  # Шаг (31 значение: 0.00, 0.01, ..., 0.30)

# ============================================================================
# ODDS BINS
# ============================================================================
# Разбивка метрик по диапазонам коэффициентов.
# Позволяет понять, в каких odds-range модель «тащит».
odds_bins:
  enabled: true
  bins: [1.0, 2.0, 3.0, 5.0, 999.0]
  labels: ["1_2", "2_3", "3_5", "5_plus"]

# Block bootstrap (circular) на финальном bet trace — CI для ROI / profit / sharpe и др.
# По умолчанию выключено (доп. время на train).
bootstrap:
  enabled: false
  n_resamples: 5000
  min_block_length: 10
  max_block_length: 30
  confidence_level: 0.95
  seed: null  # null — недетерминированно

# Tournament: UEL Kazakhstan Stream 2 (Cyberhockey)

defaults:
  - /sport@_here_: cyberhockey

name: uel_kz_2
region: kazakhstan
stream: stream_2

data:
  processed_dir: data/processed/uel_kz_2
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

# column_mapping, dtype_mapping, target_sources — наследуются из sport
# weekday, hour — генерируются в FeaturePipeline (TimeFeatureGenerator)
data_clean:
  derived_columns:
    tour_num:
      source: tour_name_en
      transform: extract_last_char
  select_columns: [id, datetime, status, home_points, away_points, home_team, away_team, tour_num]

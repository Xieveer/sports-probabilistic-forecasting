# Конфигурация турнира UEL Kazakhstan Stream 2 (Cyberhockey)
# Подтурнир UEL, разделенный на этапе ingest по полю tour_name_en

name: "uel_kz_2"
sport: "cyberhockey"
region: "kazakhstan"
stream: "stream_2"

data_clean:
  # Маппинг колонок: исходное название → унифицированное
  column_mapping:
    h_m_s: home_points  # home match score (очки/голы домашней команды)
    a_m_s: away_points  # away match score (очки/голы гостевой команды)

  # Обязательные колонки (проверка наличия)
  required_columns:
    - id
    - status
    - datetime

  # Колонки для dropna (удаление строк с пропусками)
  drop_na_columns:
    - id
    - datetime
    - status

  # Финальный набор колонок для interim слоя
  select_columns:
    - id
    - datetime
    - status
    - home_points
    - away_points

  # Типизация колонок
  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
    string:
      - id
      - status
    datetime:
      datetime:
        format: null        # Автоопределение формата pandas
        errors: "coerce"    # Невалидные даты → NaT

# Конфигурация источников таргета для разных моделей
# Используется в train.py для динамического вычисления таргета
# База для тотала (типичное значение для киберхоккея)
total_base: 5.5

target_sources:
  # === LONG FORMAT MODELS (train_long.parquet) ===
  is_win:
    player_column: "pl_points"
    opponent_column: "opp_points"
    comparison: "greater"
    format: "long"
  
  # === WIDE FORMAT MODELS (train_wide.parquet) ===
  is_home_win:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "greater"
    format: "wide"

  is_away_win:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "less"
    format: "wide"

  is_draw:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "equal"
    format: "wide"
  
  total_over:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "total_over"
    base: 5.5
    format: "wide"
  
  total_under:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "total_under"
    base: 5.5
    format: "wide"

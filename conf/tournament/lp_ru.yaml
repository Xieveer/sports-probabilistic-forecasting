# LP RU - Лига Про Настольный Теннис (Россия)
# @package _global_.tournament

name: "lp_ru"
sport: "table_tennis"
description: "Лига Про: Настольный теннис (Россия)"

# Настройки очистки данных (специфичны для LP RU)
data_clean:
  # Маппинг колонок: приводим к унифицированным названиям
  column_mapping:
    home_score: home_sets    # Счет по СЕТАМ (для определения победителя)
    away_score: away_sets    # Счет по СЕТАМ
    # NOTE: home_points, away_points будут извлечены из scores.parts в clean.py

  # Обязательные колонки
  required_columns:
    - id
    - datetime

  # По этим колонкам дропаем строки с NaN
  drop_na_columns:
    - id
    - datetime

  # Колонки для финального датасета (после маппинга)
  select_columns:
    - id
    - datetime
    - status
    - home_sets      # Счет по сетам (для is_win)
    - away_sets
    - home_points    # Сумма поинтов (для total и фичей)
    - away_points
    - scores         # JSON с деталями (для парсинга)

  # LP турниры: все матчи finished, добавляем колонку status
  default_status: "finished"

  # Типизация колонок
  dtype_mapping:
    numeric:
      home_sets: int       # Счет по сетам
      away_sets: int
      home_points: float   # Сумма поинтов (будет вычислено из scores)
      away_points: float
    string:
      - id
      - status
    datetime:
      datetime:
        format: null
        errors: "coerce"

# Источники данных для вычисления различных таргетов
# Диапазоны тоталов (для автоматической генерации моделей)
total_ranges:
  min: 60.5
  max: 80.5
  step: 1.0
  default: 70.5  # Базовое значение для демо

target_sources:
  # === LONG FORMAT MODELS (train_long.parquet) ===
  
  # Модель is_win: победа по СЕТАМ (правильная логика для настольного тенниса)
  is_win:
    player_column: "pl_sets"      # Используем счет по сетам!
    opponent_column: "opp_sets"
    comparison: "greater"  # pl_sets > opp_sets
    format: "long"
  
  # === WIDE FORMAT MODELS (train_wide.parquet) ===
  
  # Legacy: победа по сетам
  is_home_win:
    home_column: "home_sets"      # Используем счет по сетам!
    away_column: "away_sets"
    comparison: "greater"
    format: "wide"
  
  # Тотал по ПОИНТАМ (сумма всех очков во всех сетах)
  total_over:
    home_column: "home_points"    # Сумма поинтов
    away_column: "away_points"
    comparison: "total_over"
    base: 70.5  # Берется из total_ranges.default
    format: "wide"
  
  total_under:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "total_under"
    base: 70.5
    format: "wide"

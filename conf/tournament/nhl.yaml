# Tournament: NHL (ice hockey)

defaults:
  - /sport@_here_: ice_hockey

name: nhl
region: north_america
description: "National Hockey League (источник: nhl_web_api)"

data:
  processed_dir: data/processed/nhl
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

data_clean:
  derived_columns:
    # Явные финальные голы для OT-рынков (копия home_points/away_points; см. ice_hockey.yaml, R22.8).
    home_goals_full:
      source: home_points
      transform: copy
    away_goals_full:
      source: away_points
      transform: copy
    tour_num:
      source: datetime
      transform: hour_to_time_of_day
    weekday:
      source: datetime
      transform: dayofweek
  select_columns:
    - id
    - datetime
    - status
    - home_points
    - away_points
    - home_goals_reg
    - away_goals_reg
    - home_goals_full
    - away_goals_full
    - home_team
    - away_team
    - season
    - game_type
    - match_end
    - home_sog_ft
    - away_sog_ft
    - home_sog_mt
    - away_sog_mt
    - home_bs_ft
    - away_bs_ft
    - home_bs_mt
    - away_bs_mt
    - home_hits_ft
    - away_hits_ft
    - home_hits_mt
    - away_hits_mt
    - home_pim_ft
    - away_pim_ft
    - home_pim_mt
    - away_pim_mt
    - home_2pim_ft
    - away_2pim_ft
    - home_2pim_mt
    - away_2pim_mt
    - home_fow_ft
    - away_fow_ft
    - home_fow_mt
    - away_fow_mt
    - home_conference_standing
    - home_P
    - home_GP
    - away_conference_standing
    - away_P
    - away_GP
    - home_roster
    - away_roster
    - tour_num
    - weekday

stats:
  avg_home_points: 3.0
  avg_away_points: 2.8
  avg_total: 5.8
  typical_range: [1, 12]

time_range:
  start: "1999-10-01"
  end: null

# Tournament: NHL (ice hockey)

defaults:
  - /sport@_here_: ice_hockey

name: nhl
region: north_america
description: "National Hockey League (источник: nhl_web_api)"

# R26: при дефолтном ``bookmaker=fonbet`` из корня ``apply_tournament_default_bookmaker`` подменяет на ``the_odds_api``.
# R22.8 OT-рынки: ``winner_withOT``, ``total_*_withOT`` — см. HOW_TO_ADD_NEW_MARKET (NHL).
# Примеры train::
#   uv run python -m sports_forecast.train tournament=nhl market=winner_withOT market_spec=winner_withOT \\
#       algorithm=catboost features=advanced
#   make train-sweep-nhl-ot-winner
# Promote / MLflow (после сравнения)::
#   make promote EXP=nhl__winner_withOT METRIC=test_logloss DIR=minimize
# Materialize::
#   make materialize TOURNAMENT=nhl MARKET=winner_withOT SPEC=winner_withOT

data:
  processed_dir: data/processed/nhl
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

data_clean:
  # R26: после merge The Odds API в source — собрать odds_raw для BettingSimulator (как UEL/LP).
  build_synthetic_odds_raw: true
  synthetic_odds_raw_bookmaker: the_odds_api
  derived_columns:
    # Явные финальные голы для OT-рынков (копия home_points/away_points; см. ice_hockey.yaml, R22.8).
    home_goals_full:
      source: home_points
      transform: copy
    away_goals_full:
      source: away_points
      transform: copy
    tour_num:
      source: datetime
      transform: hour_to_time_of_day
    weekday:
      source: datetime
      transform: dayofweek
  select_columns:
    - id
    - datetime
    - status
    - home_points
    - away_points
    - home_goals_reg
    - away_goals_reg
    - home_goals_full
    - away_goals_full
    - home_team
    - away_team
    - season
    - game_type
    - match_end
    - home_sog_ft
    - away_sog_ft
    - home_sog_mt
    - away_sog_mt
    - home_bs_ft
    - away_bs_ft
    - home_bs_mt
    - away_bs_mt
    - home_hits_ft
    - away_hits_ft
    - home_hits_mt
    - away_hits_mt
    - home_pim_ft
    - away_pim_ft
    - home_pim_mt
    - away_pim_mt
    - home_2pim_ft
    - away_2pim_ft
    - home_2pim_mt
    - away_2pim_mt
    - home_fow_ft
    - away_fow_ft
    - home_fow_mt
    - away_fow_mt
    - home_conference_standing
    - home_P
    - home_GP
    - away_conference_standing
    - away_P
    - away_GP
    - home_roster
    - away_roster
    - tour_num
    - weekday
    # Passthrough для тренера (в interim автодобавляется, если не указать — тоже ок)
    - odds_raw

stats:
  avg_home_points: 3.0
  avg_away_points: 2.8
  avg_total: 5.8
  typical_range: [1, 12]

time_range:
  start: "1999-10-01"
  end: null

# Сезонный holdout для обучения (раньше только в ``nhl_train``; R38 — один slug ``nhl``).
# SEASON_ID как в источнике NHL (строка 8 цифр или int в parquet).
train_eval_split:
  kind: season_holdout
  season_column: season
  holdout_seasons:
    - "20232024"
    - "20242025"
    - "20252026"
  train_seasons: null

# Опционально (R34): walk-forward на holdout по календарным месяцам
# walk_forward:
#   enabled: true

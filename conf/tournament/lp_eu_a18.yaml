# Tournament: Liga Pro Europe A18 (Table Tennis)

defaults:
  - /sport@_here_: table_tennis

name: lp_eu_a18
region: europe
category: a18

data:
  processed_dir: data/processed/lp_eu_a18
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

# target_sources, allowed_market_specs, column_mapping, dtype_mapping, derived_columns — наследуются из sport
# weekday, hour — генерируются в FeaturePipeline (TimeFeatureGenerator)
# tour_num — генерируется из tour_datetime (sport-level)
data_clean:
  select_columns: [id, datetime, status, home_sets, away_sets, home_points, away_points, home_team, away_team, tour_match_num, tour_num]

# Конфигурация турнира LP EU A18 (Table Tennis - Liga Pro Europe)
# Подтурнир LP_EU, разделенный на этапе ingest по полю tour_name_g

name: "lp_eu_a18"
sport: "table_tennis"
region: "europe"
group: "a18"

data_clean:
  # Маппинг колонок: исходное название → унифицированное
  column_mapping:
    _hmps: home_points  # home match points (очки домашней команды)
    _amps: away_points  # away match points (очки гостевой команды)

  # Обязательные колонки (проверка наличия)
  required_columns:
    - id
    - datetime

  # Колонки для dropna (удаление строк с пропусками)
  drop_na_columns:
    - id
    - datetime

  # Финальный набор колонок для interim слоя
  select_columns:
    - id
    - datetime
    - home_points
    - away_points

  # Типизация колонок
  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
    string:
      - id
    datetime:
      datetime:
        format: null        # Автоопределение формата pandas
        errors: "coerce"    # Невалидные даты → NaT

  # LP турниры содержат только finished матчи, добавляем статус по умолчанию
  default_status: "finished"

# Конфигурация источников таргета для разных моделей
# Используется в train.py для динамического вычисления таргета
target_sources:
  # Модель is_home_win: победа домашней команды
  is_home_win:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "greater"  # home_points > away_points

  # Модель is_away_win: победа гостевой команды
  is_away_win:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "less"  # home_points < away_points

  # Модель is_draw: ничья
  is_draw:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "equal"  # home_points == away_points

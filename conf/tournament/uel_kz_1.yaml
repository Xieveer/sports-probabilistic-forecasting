# Tournament: UEL Kazakhstan Stream 1 (Cyberhockey)
# Подтурнир UEL, разделенный на этапе ingest по полю tour_name_en

defaults:
  - /sport@_here_: cyberhockey

name: uel_kz_1
region: kazakhstan
stream: stream_1
description: "UEL Kazakhstan Stream 1 - Cyberhockey esports"

# ============================================================================
# ДАННЫЕ: Пути к обработанным данным
# ============================================================================

data:
  processed_dir: data/processed/uel_kz_1
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

# ============================================================================
# FORM PARAMS (override спорта если нужно для этого турнира)
# ============================================================================
# Наследуются из sport/cyberhockey.yaml: fg=480, dp=30
# Раскомментировать для override:
# form_params:
#   fg_trigger_minutes: 600
#   dp_trigger_minutes: 25

# ============================================================================
# DATA CLEAN: Турнир-специфичная конкретика
# ============================================================================
# column_mapping, dtype_mapping, required_columns — наследуются из sport
data_clean:
  # Генерация производных колонок (специфично для UEL)
  derived_columns:
    tour_num:
      source: tour_name_en
      transform: extract_last_char
    weekday:
      source: datetime
      transform: dayofweek
    hour:
      source: datetime
      transform: hour

  # Финальный набор колонок для interim (специфичен для турнира)
  select_columns:
    - id
    - datetime
    - status
    - home_points
    - away_points
    - home_short_name_en
    - away_short_name_en
    - tour_match_num
    - tour_num
    - weekday
    - hour

# ============================================================================
# МЕТАДАННЫЕ
# ============================================================================

stats:
  avg_home_points: 5.5
  avg_away_points: 5.0
  avg_total: 10.5
  typical_range: [3, 15]

time_range:
  start: "2024-01-06"
  end: "2025-10-19"

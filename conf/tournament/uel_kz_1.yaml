# Tournament: UEL Kazakhstan Stream 1 (Cyberhockey)
# Подтурнир UEL, разделенный на этапе ingest по полю tour_name_en

name: uel_kz_1
sport: cyberhockey
region: kazakhstan
stream: stream_1
description: "UEL Kazakhstan Stream 1 - Cyberhockey esports"

# ============================================================================
# ДАННЫЕ: Пути к обработанным данным
# ============================================================================

data:
  # Базовая директория
  processed_dir: data/processed/uel_kz_1

  # Доступные форматы данных
  formats:
    long: train_long.parquet      # Player vs Opponent format
    wide: train_wide.parquet      # Home vs Away format

  # Inference данные
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

  # Букмекерские коэффициенты
  odds_feed:
    enabled: true
    column: fon_bet_odds_feed
    bookmaker: fonbet
    format: python_dict  # ast.literal_eval()

# ============================================================================
# РЕЕСТР ДОПУСТИМЫХ MARKET SPECS
# ============================================================================

allowed_market_specs:
  # Winner markets
  winner:
    specs:
      - winner_home    # Победа хозяев (wide format)
    default_recipe: winner_baseline

  # Total markets
  total:
    # Допустимые линии для киберхоккея
    lines: [3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5]
    specs:
      - total_over
      - total_under
    default_recipe: total_baseline

# ============================================================================
# ОБРАБОТКА ДАННЫХ (для data pipeline)
# ============================================================================

data_clean:
  # Маппинг колонок
  column_mapping:
    h_m_s: home_points
    a_m_s: away_points

  # Обязательные колонки
  required_columns:
    - id
    - status
    - datetime

  # Колонки для dropna
  drop_na_columns:
    - id
    - datetime
    - status

  # Финальный набор колонок для interim
  select_columns:
    - id
    - datetime
    - status
    - home_points
    - away_points
    - home_short_name_en
    - away_short_name_en
    - tour_match_num
    - tour_num
    - weekday
    - hour

  # Типизация
  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
    string:
      - id
      - status
    datetime:
      datetime:
        format: null
        errors: coerce

# ============================================================================
# МЕТАДАННЫЕ
# ============================================================================

# Статистика турнира (для валидации)
stats:
  avg_home_points: 5.5
  avg_away_points: 5.0
  avg_total: 10.5
  typical_range: [3, 15]  # Типичный диапазон тотала

# Временной диапазон данных
time_range:
  start: "2024-01-06"
  end: "2025-10-19"

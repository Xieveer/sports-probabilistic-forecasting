# LP EU - Лига Про Настольный Теннис (Европа)
# @package _global_.tournament

name: lp_eu
sport: table_tennis
description: 'Лига Про: Настольный теннис (Европа)'
data_clean:
  column_mapping:
    home_score: home_sets
    away_score: away_sets
    _hmps: home_points
    _amps: away_points
  required_columns:
  - id
  - datetime
  drop_na_columns:
  - id
  - datetime
  select_columns:
  - id
  - datetime
  - status
  - home_sets
  - away_sets
  - home_points
  - away_points
  default_status: finished
  dtype_mapping:
    numeric:
      home_sets: int
      away_sets: int
      home_points: float
      away_points: float
    string:
    - id
    - status
    datetime:
      datetime:
        format: null
        errors: coerce
total_ranges:
  min: 60.5
  max: 80.5
  step: 1.0
  default: 70.5
target_sources:
  is_win:
    player_column: pl_sets
    opponent_column: opp_sets
    comparison: greater
    format: long
  is_home_win:
    home_column: home_sets
    away_column: away_sets
    comparison: greater
    format: wide
  total_over:
    home_column: home_points
    away_column: away_points
    comparison: total_over
    base: 70.5
    format: wide
  total_under:
    home_column: home_points
    away_column: away_points
    comparison: total_under
    base: 70.5
    format: wide
odds:
  enabled: true
  source_column: sdf_odds_feed
  bookmaker: sdf
  parse_format: python_dict
  coverage: 28.1

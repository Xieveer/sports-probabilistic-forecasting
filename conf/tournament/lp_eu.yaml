# Tournament: Liga Pro Europe (Table Tennis)

defaults:
  - /sport@_here_: table_tennis

name: lp_eu
region: europe

data:
  processed_dir: data/processed/lp_eu
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

# target_sources, allowed_market_specs, column_mapping, dtype_mapping — наследуются из sport
# weekday, hour — генерируются в FeaturePipeline (TimeFeatureGenerator)
data_clean:
  select_columns: [id, datetime, status, home_sets, away_sets, home_points, away_points, home_team, away_team]

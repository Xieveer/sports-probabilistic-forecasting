# Tournament: UEL Czech (Cyberhockey)

name: uel_cz
sport: cyberhockey
region: czech

data:
  processed_dir: data/processed/uel_cz
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

allowed_market_specs:
  winner:
    specs: [winner_home]
  total:
    lines: [3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5]
    specs: [total_over, total_under]

data_clean:
  column_mapping:
    h_m_s: home_points
    a_m_s: away_points
  required_columns: [id, status, datetime]
  drop_na_columns: [id, datetime, status]
  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
    string: [id, status]
    datetime:
      datetime:
        format: null
        errors: coerce
  derived_columns:
    tour_num:
      source: tour_name_en
      transform: extract_last_char
    weekday:
      source: datetime
      transform: dayofweek
    hour:
      source: datetime
      transform: hour
  select_columns: [id, datetime, status, home_points, away_points, tour_num, weekday, hour]

# Tournament: UEL Czech (Cyberhockey)

defaults:
  - /sport@_here_: cyberhockey

name: uel_cz
region: czech

data:
  processed_dir: data/processed/uel_cz
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

# column_mapping, dtype_mapping, target_sources, derived_columns — наследуются из sport
# weekday, hour — генерируются в FeaturePipeline (TimeFeatureGenerator)
# tour_num — генерируется из tour_datetime (sport-level)
data_clean:
  select_columns: [id, datetime, status, home_points, away_points, home_team, away_team, home_cteam, away_cteam, tour_match_num, tour_num]

# Tournament: UEL Czech (Cyberhockey)

defaults:
  - /sport@_here_: cyberhockey

name: uel_cz
region: czech

data:
  processed_dir: data/processed/uel_cz
  formats:
    long: train_long.parquet
    wide: train_wide.parquet
  inference:
    long: inference_long.parquet
    wide: inference_wide.parquet

# column_mapping, dtype_mapping, target_sources — наследуются из sport
data_clean:
  derived_columns:
    tour_num:
      source: tour_name_en
      transform: extract_last_char
    weekday:
      source: datetime
      transform: dayofweek
    hour:
      source: datetime
      transform: hour
  select_columns: [id, datetime, status, home_points, away_points, home_short_name_en, away_short_name_en, tour_num, weekday, hour]

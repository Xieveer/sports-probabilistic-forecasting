# NHL baseline training config (R22 Phase A). Hydra group: ``tournament=nhl_train``.
#
# Composes full tournament definition from ``nhl`` (same processed parquet paths as ``tournament=nhl``).
# Artifact paths / MLflow experiment use ``name: nhl_train`` so promoted models live under
# ``models/nhl_train/<market_spec>/…`` — keep ``tournament=nhl`` for ingest/features-only workflows.
#
# ------------------------------------------------------------------------------
# Phase C (R22.8) — OT-inclusive markets: отдельные Hydra-прогоны от baseline winner/total.
#   - Имена: ``winner_withOT`` (long), ``total_over_withOT`` / ``total_under_withOT`` (wide, нужна line).
#   - Лейблы: финальный счёт ``pl_goals_full`` / ``home_goals_full`` (источник: boxscore ``*_ft``);
#     регламент: ``*_goals_reg`` ← ``*_mt``. Семантика ``home_points`` не менялась (= финал из ``*_ft``).
# Примеры:
#   uv run python -m sports_forecast.train tournament=nhl_train market=winner_withOT \\
#       market_spec=winner_withOT algorithm=catboost features=advanced
#   uv run python -m sports_forecast.train tournament=nhl_train market=total_withOT \\
#       market_spec=total_over_withOT market_spec.line=6.5 algorithm=catboost features=advanced
#   make train-sweep-nhl-ot-winner   # multirun catboost+lgbm
# Контракт колонок: docs/cursor/context/HOW_TO_ADD_NEW_MARKET.md (NHL full vs regulation).
# ------------------------------------------------------------------------------
# R22 Phase A note: baseline ``market=winner`` uses ``player_win`` ↔ ``home_points`` (long pl_points),
# which today equals final score from ``home_score_ft`` — see HOW_TO_ADD_NEW_MARKET NHL section.
#
# Hydra examples (baseline):
#   make train-sweep-nhl
#   uv run python -m sports_forecast.train tournament=nhl_train market=winner market_spec=winner \\
#       algorithm=catboost features=advanced
#
# Season holdout override (e.g. finished season only):
#   tournament.train_eval_split.holdout_seasons=[20232024]
#
# Promote / MLflow experiment name: ``nhl_train__winner``
#   make promote EXP=nhl_train__winner
#
# Materialize (after deploy.yaml under promoted ``best/``):
#   make materialize TOURNAMENT=nhl_train MARKET=winner SPEC=winner
# ------------------------------------------------------------------------------

defaults:
  - nhl

name: nhl_train

# Full-season holdout (temporal). Rows with ``season`` in holdout → test; others → train.
# SEASON_ID format matches NHL source (8-digit string or int in parquet, e.g. 20242025).
train_eval_split:
  kind: season_holdout
  season_column: season
  holdout_seasons:
    - "20242025"
  # Restrict train rows to these seasons only; null = all seasons except holdout.
  train_seasons: null

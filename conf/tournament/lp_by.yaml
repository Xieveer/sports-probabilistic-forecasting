# LP BY - Лига Про Настольный Теннис (Беларусь)
# @package _global_.tournament

name: "lp_by"
sport: "table_tennis"
description: "Лига Про: Настольный теннис (Беларусь)"

# Настройки очистки данных (специфичны для LP BY)
data_clean:
  # Маппинг колонок: приводим к унифицированным названиям
  column_mapping:
    _hmps: home_points
    _amps: away_points

  # Обязательные колонки
  required_columns:
    - id
    - datetime

  # По этим колонкам дропаем строки с NaN
  drop_na_columns:
    - id
    - datetime

  # Колонки для финального датасета (после маппинга)
  select_columns:
    - id
    - datetime
    - home_points
    - away_points

  # LP турниры: все матчи finished, добавляем колонку status
  default_status: "finished"

  # Типизация колонок
  dtype_mapping:
    numeric:
      home_points: float
      away_points: float
    string:
      - id
      - status
    datetime:
      datetime:
        format: null
        errors: "coerce"

# Источники данных для вычисления различных таргетов
# База для тотала (типичное значение для настольного тенниса)
total_base: 21.5

target_sources:
  # === LONG FORMAT MODELS (train_long.parquet) ===
  is_win:
    player_column: "pl_points"
    opponent_column: "opp_points"
    comparison: "greater"
    format: "long"
  
  # === WIDE FORMAT MODELS (train_wide.parquet) ===
  is_home_win:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "greater"
    format: "wide"
  
  total_over:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "total_over"
    base: 21.5
    format: "wide"
  
  total_under:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "total_under"
    base: 21.5
    format: "wide"
    description: "Победа хозяев (по поинтам)"

  # Таргет: победа гостей
  is_away_win:
    home_column: "home_points"
    away_column: "away_points"
    comparison: "less"             # home < away
    description: "Победа гостей (по поинтам)"

  # Источник для таргетов типа total_under/total_over
  total:
    home_column: "home_points"
    away_column: "away_points"
    aggregation: "sum"             # home + away
    description: "Общее количество поинтов"

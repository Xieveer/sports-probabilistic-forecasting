# Tournament: ALL (Multi-tournament режим)
# Специальный маркер для обработки всех турниров

name: all
sport: multiple
description: "Multi-tournament mode (process all available tournaments)"

# Список доступных турниров
tournaments:
  cyberhockey:
    - uel_kz_1
    - uel_kz_2
    - uel_cz
  table_tennis:
    - lp_by
    - lp_eu
    - lp_eu_a18
    - lp_ru

# Дефолтные form_params и player_id_attr для резолва interpolation в features конфиге.
# При обработке конкретного турнира features_build.py должен подгружать
# турнир-специфичный конфиг с правильными параметрами.
# TODO: рефакторинг features_build.py для per-tournament конфигов
form_params:
  fg_trigger_minutes: 480
  dp_trigger_minutes: 30

player_id_attr: "short_name_en"

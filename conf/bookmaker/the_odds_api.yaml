# Bookmaker provider: The Odds API (REST)
# Документация: https://the-odds-api.com/liveapi/guides/v4/#overview
# Политика проекта (NHL, валидация без фич): docs/cursor/source_data/the_odds_api.md
#
# ВАЖНО: формат отличается от fonbet — здесь нет odds_raw dict из CSV-фида.
# Конфиг используется клиентом обогащения (R19) и merge в source, не как
# defaults в conf/config.yaml (там по-прежнему fonbet для лиг с фонбетом).

name: the_odds_api
description: "The Odds API — REST-источник линий букмекеров (Pinnacle и др.)"

# Ключ доступа только из окружения: ODDS_API_KEY (не хранить в репозитории).

api:
  base_url: https://api.the-odds-api.com
  api_prefix: /v4
  # Рекомендуемые рынки для NHL moneyline / totals (уточнить под подписку)
  markets_h2h:
    - h2h
  markets_totals:
    - totals

# Ключ спорта в пути API: GET /v4/sports/{sport}/odds/
# Список ключей: раздел Sports в документации The Odds API.
sport_keys:
  nhl: icehockey_nhl

# Ключ букмекера в JSON ответа: bookmakers[].key
bookmakers:
  primary: pinnacle

# Профили букмекеров (R21): семантика имён для OddsStore V3 / enrichment.
# Контракт: winner / total = regulation; winner_withOT / total_withOT = полный матч (вкл. ОТ/буллиты).
bookmaker_profiles:
  pinnacle:
    key: pinnacle
    winner_semantics: winner_withOT
    total_semantics: total_withOT
    has_draw: false
  onexbet:
    key: onexbet
    winner_semantics: winner
    total_semantics: total
    has_draw: true

# Параметры close-only snapshot (R21.11): T−N минут до min(commence) по seed-запросу; см. discover_close_snapshot_for_day.
# Устаревшие open_probe / close_margin_hours (R21.4) в backfill не используются — оставьте в комментариях при необходимости сравнения.
snapshot_discovery:
  close_t_minus_minutes: 15

# Имена колонок в source.csv после merge — legacy (R19/R20), один Pinnacle без суффиксов семантики.
# R21 V3: колонки OddsStore и merge — close-only по bookmaker_profiles; канонический список:
# sports_forecast.data.providers.odds.store.ODDS_STORE_COLUMNS_V3 (alias ODDS_STORE_COLUMNS).
# Секция output_columns ниже — legacy R19/R20 (один Pinnacle, старые имена); при merge с
# bookmaker_profiles используются семантические имена V3.
output_columns:
  moneyline:
    home_open: pinnacle_home_open
    away_open: pinnacle_away_open
    draw_open: pinnacle_draw_open
    home_close: pinnacle_home_close
    away_close: pinnacle_away_close
    draw_close: pinnacle_draw_close
  total:
    open: pinnacle_total_open
    close: pinnacle_total_close

# Подсказки для клиента (реализация R19)
rate_limit:
  # Соблюдать заголовки x-requests-remaining / x-requests-used; кэш ответов на диск.
  min_interval_sec: 0.5

# Параметры backfill: фиксированные UTC-времена внутри календарного дня (legacy).
# Deprecated: основной поток R21 — snapshot_discovery + динамические ISO; эти поля — fallback,
# если commence_time недоступен или включён legacy-режим (см. backfill CLI / R21.5).
backfill:
  open_snapshot_utc: "12:00:00" # deprecated: fallback fixed open
  close_snapshot_utc: "23:30:00" # deprecated: fallback fixed close

# quota_budget_per_run: максимум реальных HTTP GET к The Odds API за один запуск
# (``run_backfill``, инкрементальный odds-refresh). Кэш на диск не уменьшает счётчик;
# 0 = без лимита. При исчерпании — graceful stop, прогресс в OddsStore/checkpoint.
quota_budget_per_run: 800

# seasons: календарные границы по турниру (ключ = каталог data/source, напр. nhl).
# Используется в ``backfill --seasons N`` (N последних окон) и пустом OddsStore
# (refresh подставляет окно последнего сезона). Даты в ISO UTC.
seasons:
  nhl:
    - name: "2023-24"
      date_from: "2023-10-10"
      date_to: "2024-06-25"
    - name: "2024-25"
      date_from: "2024-10-04"
      date_to: "2025-06-25"
    - name: "2025-26"
      date_from: "2025-10-07"
      date_to: "2026-06-30"

# ---------------------------------------------------------------------------
# R26 — train-time BettingSimulator (NHL): primary = synthetic odds_raw из wide
# ---------------------------------------------------------------------------
# Выбран путь «как UEL/LP»: на clean из merge-колонок (Pinnacle close V3/V1)
# собирается строковый Python-dict в колонке ``odds_raw`` — тот же контракт,
# что и у Fonbet CSV; извлечение — ``extract_odds_from_raw`` + ``market_keys`` / ``side_keys``.
#
# Альтернатива (не используется по умолчанию): ``odds_transport.mode: wide_columns``
# — читать decimal напрямую из merge-колонок без ``odds_raw`` (см. ``extract_betting_odds``).
# Для новых турниров с merge odds: достаточно YAML (колонки + ключи), без отдельного eval-модуля.

# Маппинг market_spec.name → ключ в synthetic dict (как у fonbet; для long winner_withOT
# ключ берётся из side_keys, эти поля — для wide / totals).
market_keys:
  winner_withOT: "1"        # широкий fallback (редко); long → side_keys
  total_over_withOT: "to_{line}"
  total_under_withOT: "tu_{line}"

# Long-format winner_withOT / winner: сторона строки → ключ в dict
side_keys:
  h: "1"
  a: "2"

# Сборка ``odds_raw`` на этапе clean (sports_forecast.data.clean): по первой
# непустой колонке из списка кандидатов на строку.
synthetic_odds_raw:
  winner_withOT_h2h:
    key_to_column_candidates:
      "1":
        - pinnacle_winner_withOT_home_close
        - pinnacle_home_close
      "2":
        - pinnacle_winner_withOT_away_close
        - pinnacle_away_close
  total_withOT:
    line_column_candidates:
      - pinnacle_total_withOT_line_close
    over_column_candidates:
      - pinnacle_total_withOT_over_close
    under_column_candidates:
      - pinnacle_total_withOT_under_close
    over_key_template: "to_{line}"
    under_key_template: "tu_{line}"

# Опциональный обход без dict: подставить non-null колонки для long h2h.
odds_transport:
  mode: null
  long_winner_specs: [winner, winner_withOT]
  home_close_column_candidates:
    - pinnacle_winner_withOT_home_close
    - pinnacle_home_close
  away_close_column_candidates:
    - pinnacle_winner_withOT_away_close
    - pinnacle_away_close

# ---------------------------------------------------------------------------
# Совместимость с ingest (fonbet-стиль raw): merge из API
# ---------------------------------------------------------------------------
# base_mapping/patterns не используются — линии приходят из OddsStore + merge.

# Team name registry: NHL Web API (source) ↔ The Odds API (R21.13)
#
# Формат
#   nhl_api:   трёхбуквенный код из source/NHL API → канонический аббр. (обычно тождество).
#   odds_api:  нормализованное имя/ключ из ответа The Odds API → тот же канонический аббр.
#              Ключ — то, что даёт normalize_team_key(...) для строки home_team/away_team
#              из JSON букмекера (без пробелов, верхний регистр в этом файле).
#
# Workflow пополнения
#   1. После backfill/merge откройте data/source/nhl/odds/unmatched_teams.csv (если есть).
#   2. Для каждой пары (odds_key ↔ ожидаемый abbr) добавьте строку odds_api: KEY: ABBR.
#   3. Переезды/ребрендинг (например Utah): несколько вариантов API-имени → одна команда —
#      отдельная строка odds_api на каждый вариант (см. UTAH* → UTA ниже).
#   4. Прогоните тесты/merge локально; закоммитьте только осмысленные правки реестра.
#
# Шаблон-источник: data/source/nhl/odds/registry_mapping_template.csv


# Bookmaker: Fonbet
# Конфигурация маппинга коэффициентов

name: fonbet
description: "Fonbet - российский букмекер"

# ============================================================================
# МАППИНГ КЛЮЧЕЙ ODDS DICT → КОЛОНКИ (для expand-пайплайна)
# ============================================================================

# Базовые маппинги (основные рынки)
base_mapping:
  "1": odds_home_win
  "x": odds_draw
  "2": odds_away_win

# Паттерны для дополнительных рынков
patterns:
  # Тоталы
  - prefix: "to_"
    type: total_over
    template: "odds_total_over_{value}"
    description: "Total Over (больше)"

  - prefix: "tu_"
    type: total_under
    template: "odds_total_under_{value}"
    description: "Total Under (меньше)"

  # Форы
  - prefix: "f1"
    type: handicap_home
    template: "odds_handicap_home{value}"
    description: "Handicap Home (фора хозяев)"

  - prefix: "f2"
    type: handicap_away
    template: "odds_handicap_away{value}"
    description: "Handicap Away (фора гостей)"

# ============================================================================
# МАППИНГ MARKET_SPEC → КЛЮЧ В RAW ODDS DICT
# ============================================================================
# Используется в extract_odds_from_raw() для извлечения нужного коэффициента
# из строки odds_raw = "{'1': 1.48, '2': 2.45, 'to_5.5': 1.90, ...}".
#
# Статические рынки: ключ — фиксированная строка.
# Параметрические рынки (total, handicap): ключ = prefix + line.
#   {line} подставляется из market_spec.line.

market_keys:
  winner_home: "1"
  winner_away: "2"
  draw: "x"
  total_over: "to_{line}"
  total_under: "tu_{line}"
  handicap_home: "f1_{line}"
  handicap_away: "f2_{line}"

# ============================================================================
# SIDE KEYS (для long-format winner market)
# ============================================================================
# В long format каждая строка — один игрок.  Для market_spec.name = "winner"
# нужно определить ключ по колонке side ("h" / "a").

side_keys:
  h: "1"   # home → ключ "1"
  a: "2"   # away → ключ "2"

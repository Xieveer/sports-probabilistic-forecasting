# Hyper Strategy: Grid Search (Small)
# Простой grid search по небольшой сетке параметров

strategy: grid
description: "Grid search over small parameter space"

# Параметры
enabled: true
scoring: neg_log_loss
cv: 3  # Folds для grid search
n_jobs: -1
verbose: 1

# Общая сетка (применяется к совместимым алгоритмам)
# Каждый algorithm может переопределить своё пространство
param_grid:
  # CatBoost / LightGBM
  learning_rate: [0.05, 0.1, 0.2]
  depth: [4, 6, 8]  # CatBoost
  max_depth: [4, 6, 8]  # LightGBM

  # LogReg
  C: [0.1, 1.0, 10.0]
  penalty: [l2]

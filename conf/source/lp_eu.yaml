# Source: Liga Pro Europe (Table Tennis)
# Конфигурация для обработки исходного файла data/source/lp_eu/source.csv

name: lp_eu
sport: table_tennis
region: europe
description: "Liga Pro Europe - Table Tennis"

# ============================================================================
# РАЗДЕЛЕНИЕ НА ПОДТУРНИРЫ (SPLIT STRATEGY)
# ============================================================================
# LP_EU разделяется на два подтурнира по полю tour_name_g

split_strategy:
  enabled: true
  method: column_based
  split_column: tour_name_g

  # Правила разделения
  rules:
    - condition: "equals('a18')"
      output_tournament: lp_eu_a18
      description: "Liga Pro Europe A18"

    - condition: default
      output_tournament: lp_eu
      description: "Liga Pro Europe (main)"

# ============================================================================
# БУКМЕКЕРСКИЕ КОЭФФИЦИЕНТЫ
# ============================================================================

odds:
  enabled: true
  source_column: sdf_odds_feed
  bookmaker: fonbet  # sdf - это на самом деле fonbet
  format: python_dict

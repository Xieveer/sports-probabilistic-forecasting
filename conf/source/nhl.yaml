# Source: NHL — загрузка через публичный NHL Web API (api-web.nhle.com)
#
# Документация эндпоинтов: docs/cursor/source_data/nhl_web_api.md
# Целевые колонки датасета: docs/cursor/source_data/nhl.md
#
# Перед первым полным прогоном создайте каталог data/source/nhl/ (или положите .gitkeep).
# Долгие прогоны: задайте checkpoint_file и при обрыве перезапустите ingest.

name: nhl

provider:
  type: nhl_web_api
  base_url: https://api-web.nhle.com/v1
  user_agent: SportsProbabilisticForecasting/1.0
  min_delay_sec: 0.55
  # Полный таймаут одного GET (connect + read); исторические /schedule могут быть медленными.
  timeout_sec: 90
  retries: 3
  backoff_factor: 0.6
  # Повторы именно при ConnectTimeout / ReadTimeout (не путать с retries выше — те для HTTP 5xx).
  timeout_attempts: 5
  timeout_retry_backoff_sec: 1.0
  # Интервал календаря для schedule/{date} (недельные запросы внутри)
  date_from: "2010-09-01"
  # Инкрементальный refresh: при существующем source.csv date_from сдвигается к последнему
  # завершённому матчу минус incremental_buffer_days (перекрытие для правок boxscore).
  incremental: true
  incremental_buffer_days: 3
  # null = конец «сегодня»; число дней растёт при перезапуске — см. load_schedule_progress (расширение date_to).
  date_to: null
  season_id_min: 20102011
  season_id_max: null
  # Ограничение для отладки (null = без лимита)
  max_games: null
  include_play_by_play: true
  # false: в source.csv попадают и предстоящие матчи (match_is_end=0); только OFF обогащаются boxscore.
  finished_only: false
  roster_enabled: true
  checkpoint_file: .nhl_checkpoint.txt
  # JSON: индекс расписания и якорь недели; при обрыве на schedule — продолжение без повторной выдачи якорей
  schedule_progress_file: .nhl_schedule_progress.json
  # Каждые N успешно обогащённых строк — перезапись source.csv (0 = только финальная запись)
  csv_flush_every: 50
  # Каждые N обогащённых матчей — строка INFO в лог (0 = только этапы расписания и финал)
  progress_log_every: 25

sport: ice_hockey

quality_gate:
  profile: nhl

split_strategy:
  enabled: false

# Post-step после provider.fetch (source_refresh): инкрементальный refresh в OddsStore + merge в source.csv.
# См. sports_forecast.data.providers.odds.refresh.run_odds_refresh
# R26: имена close-колонок после merge должны совпадать с ``synthetic_odds_raw`` в conf/bookmaker/the_odds_api.yaml
# (OddsStore V3 / legacy V1 — см. комментарии в YAML).
# Пути store/state/unmatched: относительно data/source/<tournament>/ (null = значения по умолчанию ниже).
odds:
  enabled: true
  bookmaker: the_odds_api
  # Букмекеры The Odds API для multi-bookmaker пайплайна (см. conf/bookmaker/the_odds_api.yaml → bookmaker_profiles)
  bookmakers: [pinnacle, onexbet]
  # Ключ рынка The Odds API (icehockey_nhl — NHL)
  sport_key: icehockey_nhl
  # Перекрытие дат относительно max(game_date) в store (дни)
  incremental_buffer_days: 3
  # Максимум календарных дат за один прогон (сегментация + refresh_state.json)
  max_days_per_refresh: 30
  # После upsert в parquet — вызвать merge_odds_into_source_csv для source.csv
  auto_merge: true
  # Parquet store (по умолчанию data/source/nhl/odds/pinnacle_odds.parquet)
  store_path: odds/pinnacle_odds.parquet
  # JSON checkpoint: last_successful_date, in_progress_from (data/source/nhl/odds/refresh_state.json)
  state_path: odds/refresh_state.json
  # Отчёт несоответствий odds↔source по командам (data/source/nhl/odds/unmatched_teams.csv)
  unmatched_report_path: odds/unmatched_teams.csv
  # Мин. доля строк source с непустым pinnacle_home_close; ниже — WARNING в лог
  min_odds_coverage_pct: 70.0

# Source: Liga Pro Russia + Belarus (Table Tennis)
# Конфигурация для обработки комбинированного файла data/source/lp_ru_by/source.csv
#
# Один CSV файл содержит данные обоих регионов.
# Разделение через _tour_name: a15 → Беларусь, остальные (a3/a4/a5/a6/а9) → Россия.
# Примечание: "а9" написан кириллицей в исходных данных, поэтому используем default.

name: lp_ru_by
sport: table_tennis
region: russia_belarus
description: "Liga Pro: Table Tennis (Russia + Belarus combined source)"

# ============================================================================
# РАЗДЕЛЕНИЕ НА ПОДТУРНИРЫ (SPLIT STRATEGY)
# ============================================================================
# Сплит по полю _tour_name (название стола):
#   a15           → lp_by  (Belarus)
#   a3/a4/a5/a6/а9 → lp_ru  (Russia)

split_strategy:
  enabled: true
  method: column_based
  split_column: _tour_name

  rules:
    - condition: "equals('a15')"
      output_tournament: lp_by
      description: "Liga Pro Belarus (table a15)"

    - condition: default
      output_tournament: lp_ru
      description: "Liga Pro Russia (tables a3/a4/a5/a6/а9)"

# ============================================================================
# БУКМЕКЕРСКИЕ КОЭФФИЦИЕНТЫ
# ============================================================================

odds:
  enabled: true
  source_column: odds_feed
  bookmaker: fonbet
  format: python_dict

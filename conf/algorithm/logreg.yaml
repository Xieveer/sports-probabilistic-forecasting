# Algorithm: Logistic Regression
# Простая линейная модель, отлично откалиброванная

name: logreg
description: "Logistic Regression (linear model with L2 regularization)"
_target_: sports_forecast.training.models.logreg.LogRegModel

# Гиперпараметры
params:
  penalty: l2
  C: 1.0
  solver: saga
  max_iter: 1000
  random_state: 777
  verbose: 0
  n_jobs: -1

# Optuna space
optuna_space:
  C:
    type: float
    low: 0.001
    high: 100.0
    log: true
  penalty:
    type: categorical
    choices: [l1, l2, elasticnet]
  solver:
    type: categorical
    choices: [saga, liblinear]

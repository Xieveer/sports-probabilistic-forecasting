# CatBoost — пространство Optuna со смещением к сильной регуляризации (слабый сигнал / много фичей).
# Отдельное имя алгоритма, чтобы SQLite-study Optuna не смешивался с `algorithm=catboost`.

name: catboost_reg
description: "CatBoost with regularization-focused Optuna search space"
_target_: sports_forecast.training.models.catboost.CatBoostModel

params:
  loss_function: Logloss
  eval_metric: Logloss
  iterations: 500
  learning_rate: 0.08
  depth: 5
  l2_leaf_reg: 10
  min_data_in_leaf: 40
  random_seed: 777
  verbose: false

optuna_space:
  learning_rate:
    type: float
    low: 0.02
    high: 0.2
    log: true
  depth:
    type: int
    low: 3
    high: 8
  l2_leaf_reg:
    type: int
    low: 5
    high: 40
  min_data_in_leaf:
    type: int
    low: 20
    high: 300
    step: 10
  iterations:
    type: int
    low: 200
    high: 900
    step: 50

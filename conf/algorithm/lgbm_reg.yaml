# LightGBM — пространство Optuna со смещением к сильной регуляризации.
# Отдельное имя алгоритма для изолированного Optuna study.

name: lgbm_reg
description: "LightGBM with regularization-focused Optuna search space"
_target_: sports_forecast.training.models.lgbm.LGBMModel

params:
  objective: binary
  metric: binary_logloss
  boosting_type: gbdt
  num_leaves: 24
  learning_rate: 0.08
  n_estimators: 500
  max_depth: 6
  min_child_samples: 80
  subsample: 0.75
  colsample_bytree: 0.75
  reg_alpha: 0.1
  reg_lambda: 5.0
  random_state: 777
  verbose: -1
  n_jobs: -1

optuna_space:
  learning_rate:
    type: float
    low: 0.02
    high: 0.2
    log: true
  num_leaves:
    type: int
    low: 8
    high: 48
  max_depth:
    type: int
    low: 3
    high: 8
  min_child_samples:
    type: int
    low: 40
    high: 300
    step: 10
  n_estimators:
    type: int
    low: 200
    high: 900
    step: 50
  subsample:
    type: float
    low: 0.55
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.45
    high: 0.95
  reg_alpha:
    type: float
    low: 0.0
    high: 8.0
  reg_lambda:
    type: float
    low: 0.5
    high: 35.0

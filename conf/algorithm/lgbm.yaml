# Algorithm: LightGBM
# Быстрый gradient boosting с листовой стратегией роста деревьев

name: lgbm
description: "LightGBM classifier (fast gradient boosting)"
_target_: sports_forecast.training.models.lgbm.LGBMModel

# Гиперпараметры
params:
  objective: binary
  metric: binary_logloss
  boosting_type: gbdt
  num_leaves: 31
  learning_rate: 0.1
  n_estimators: 500
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 0.0
  random_state: 777
  verbose: -1
  n_jobs: -1

# Optuna space
optuna_space:
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 16
    high: 128
  max_depth:
    type: int
    low: 3
    high: 12
  n_estimators:
    type: int
    low: 100
    high: 1000
    step: 100
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
  reg_alpha:
    type: float
    low: 0.0
    high: 10.0
  reg_lambda:
    type: float
    low: 0.0
    high: 10.0



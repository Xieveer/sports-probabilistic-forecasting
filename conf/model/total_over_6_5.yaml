# Модель: Тотал больше 6.5 (для wide format)
# @package _global_.model

name: "total_over_6_5"
type: "catboost"
description: "Binary classification: total over 6.5 (wide format)"
save_format: "cbm"
data_format: "wide"  # Явно указываем формат данных

# Конфигурация таргета
target_config:
  source_key: "total_over_6_5"
  name: "target_total_over_6_5"
  description: "1 если (home_points + away_points) > 6.5, 0 иначе"

# Фичи для этой модели (wide format)
feature_selection:
  mode: "auto"
  prefixes:
    - "home_f_"
    - "away_f_"

# Гиперпараметры CatBoost
params:
  loss_function: "Logloss"
  eval_metric: "Logloss"
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0
  random_seed: 42
  verbose: 100
  allow_writing_files: false
  od_type: "Iter"
  od_wait: 200


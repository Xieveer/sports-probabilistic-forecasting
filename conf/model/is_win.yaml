# Модель: Победа игрока (для long format)
# @package _global_.model
#
# Эта модель работает с long format данными, где один матч = две строки.
# Предсказывает победу текущего игрока в строке (pl vs opp).
#
# Использование:
#   train_long.parquet - для обучения
#   inference_long.parquet - для предсказаний

name: "is_win"
type: "catboost"
description: "Binary classification: player wins (long format)"
save_format: "cbm"
data_format: "long"  # Явно указываем формат данных

# Конфигурация таргета
target_config:
  source_key: "is_win"            # ссылка на tournament.target_sources.is_win
  name: "target_win"              # имя колонки в датасете
  description: "1 если pl побеждает opp, 0 иначе"

# Фичи для этой модели
# Используются фичи, сгенерированные Feature Pipeline (conf/features/basic.yaml)
features:
  # Скользящие средние (EWM)
  - "f_pl_global_ewm_10"           # EWM игрока (global context)
  - "f_opp_global_ewm_10"          # EWM оппонента (global context)
  - "f_all_global_ewm_10_diff"     # Разница EWM: pl - opp
  - "f_h2h_ewm_10_diff"            # Разница EWM в H2H матчах

  # Счётчики матчей (Count)
  - "f_pl_global_count"            # Количество матчей игрока
  - "f_opp_global_count"           # Количество матчей оппонента
  - "f_h2h_count"                  # Количество H2H встреч

  # Form фичи (состояние игроков)
  - "f_pl_is_dp"                   # Игрок играет double play
  - "f_pl_is_fg"                   # Игрок играет first game
  - "f_pl_is_form"                 # Игрок в форме
  - "f_opp_is_dp"                  # Оппонент играет double play
  - "f_opp_is_fg"                  # Оппонент играет first game
  - "f_opp_is_form"                # Оппонент в форме
  - "f_pl_mins_prev_match"         # Минуты с предыдущего матча игрока
  - "f_opp_mins_prev_match"        # Минуты с предыдущего матча оппонента
  - "f_diff_mins_prev_match"       # Разница в минутах
  - "f_match_state"                # Состояние матча (комбинированное)

# Гиперпараметры CatBoost
params:
  loss_function: "Logloss"
  eval_metric: "Logloss"
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0

  random_seed: 42
  verbose: 100
  allow_writing_files: false

  od_type: "Iter"
  od_wait: 200

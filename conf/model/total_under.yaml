# Модель: Тотал меньше (для wide format)
# @package _global_.model
#
# Предсказывает что сумма очков будет меньше базы.
# База тотала указывается в конфиге турнира (tournament.total_base).
#
# Использование:
#   train_wide.parquet - для обучения
#   inference_wide.parquet - для предсказаний

name: "total_under"
type: "catboost"
description: "Binary classification: total under base (wide format)"
save_format: "cbm"
data_format: "wide"  # Явно указываем формат данных

# Конфигурация таргета
target_config:
  source_key: "total_under"       # ссылка на tournament.target_sources.total_under
  name: "target_total_under"      # имя колонки в датасете
  description: "1 если (home_points + away_points) < base, 0 иначе"

# Фичи для этой модели (wide format)
# Используются фичи обеих команд после long_to_wide трансформации
features:
  # Home team - EWM features
  - "home_f_pl_global_ewm_10"
  - "home_f_opp_global_ewm_10"
  - "home_f_all_global_ewm_10_diff"
  - "home_f_h2h_ewm_10_diff"

  # Home team - Count features
  - "home_f_pl_global_count"
  - "home_f_opp_global_count"
  - "home_f_h2h_count"

  # Home team - Form features
  - "home_f_pl_is_dp"
  - "home_f_pl_is_fg"
  - "home_f_pl_is_form"
  - "home_f_opp_is_dp"
  - "home_f_opp_is_fg"
  - "home_f_opp_is_form"
  - "home_f_pl_mins_prev_match"
  - "home_f_opp_mins_prev_match"
  - "home_f_diff_mins_prev_match"
  - "home_f_match_state"

  # Away team - EWM features
  - "away_f_pl_global_ewm_10"
  - "away_f_opp_global_ewm_10"
  - "away_f_all_global_ewm_10_diff"
  - "away_f_h2h_ewm_10_diff"

  # Away team - Count features
  - "away_f_pl_global_count"
  - "away_f_opp_global_count"
  - "away_f_h2h_count"

  # Away team - Form features
  - "away_f_pl_is_dp"
  - "away_f_pl_is_fg"
  - "away_f_pl_is_form"
  - "away_f_opp_is_dp"
  - "away_f_opp_is_fg"
  - "away_f_opp_is_form"
  - "away_f_pl_mins_prev_match"
  - "away_f_opp_mins_prev_match"
  - "away_f_diff_mins_prev_match"
  - "away_f_match_state"

# Гиперпараметры CatBoost
params:
  loss_function: "Logloss"
  eval_metric: "Logloss"
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0

  random_seed: 42
  verbose: 100
  allow_writing_files: false

  od_type: "Iter"
  od_wait: 200

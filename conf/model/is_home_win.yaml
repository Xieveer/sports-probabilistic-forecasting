# Модель: Победа хозяев (бинарная классификация)
# @package _global_.model

name: "is_home_win"
type: "catboost"
description: "Binary classification: home team wins"
save_format: "cbm"

# Конфигурация таргета
target_config:
  source_key: "is_win"            # ссылка на tournament.target_sources.is_win (long format)
  name: "target_home_win"         # имя колонки в датасете

# Фичи для этой модели
# Автоматически используются ВСЕ фичи с префиксом f_ из датасета
# (генерируются Feature Pipeline согласно conf/features/basic.yaml)
feature_selection:
  mode: "auto"              # Автоматический отбор всех f_* колонок
  prefix: "f_"              # Префикс фичей для автоматического отбора

  # Опционально: можно явно исключить проблемные фичи
  # exclude: []

# Гиперпараметры CatBoost
params:
  loss_function: "Logloss"
  eval_metric: "AUC"
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0

  random_seed: 42
  verbose: 100
  allow_writing_files: false

  od_type: "Iter"
  od_wait: 200

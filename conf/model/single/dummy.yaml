# Dummy модель (baseline)
# Предсказывает на основе частот классов в обучающей выборке

name: dummy
description: "Baseline модель для сравнения (DummyClassifier)"
type: single
model_class: DummyModel

# Параметры модели
params:
  strategy: prior  # Предсказывает частоты классов
  random_state: 777

# Формат данных (long/wide)
data_format: long

# Конфигурация таргета (ссылается на tournament.target_sources)
target_config:
  source_key: is_win
  name: target_is_win

# Отбор фичей
feature_selection:
  mode: auto
  prefix: "f_"


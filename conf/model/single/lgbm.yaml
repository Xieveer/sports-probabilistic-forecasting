# LightGBM модель
# Быстрая альтернатива CatBoost

name: lgbm
description: "LightGBM классификатор (быстрый)"
type: single
model_class: LGBMModel

# Параметры модели
params:
  objective: binary
  metric: binary_logloss
  n_estimators: 500
  learning_rate: 0.1
  max_depth: 7
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 0.0
  random_state: 777
  verbose: -1

# Формат данных
data_format: long

# Конфигурация таргета
target_config:
  source_key: is_win
  name: target_is_win

# Отбор фичей
feature_selection:
  mode: auto
  prefix: "f_"

# Optuna оптимизация
optuna:
  enabled: true
  n_trials: 30

# Калибровка
calibration:
  enabled: true
  threshold_ece: 0.1
  method: isotonic


# Модель: Тотал больше (для wide format)
# @package _global_.model
#
# Предсказывает что сумма очков будет больше базы.
# База тотала указывается в конфиге турнира (tournament.total_base).
#
# Использование:
#   train_wide.parquet - для обучения
#   inference_wide.parquet - для предсказаний

name: "total_over"
type: "catboost"
description: "Binary classification: total over base (wide format)"
save_format: "cbm"
data_format: "wide"  # Явно указываем формат данных

# Конфигурация таргета
target_config:
  source_key: "total_over"        # ссылка на tournament.target_sources.total_over
  name: "target_total_over"       # имя колонки в датасете
  description: "1 если (home_points + away_points) > base, 0 иначе"

# Фичи для этой модели
# Для тотала используем агрегированные фичи обеих команд
features:
  # Home team form
  - "home_f_pl_is_dp"
  - "home_f_pl_is_fg"
  - "home_f_pl_is_form"

  # Away team form
  - "away_f_pl_is_dp"
  - "away_f_pl_is_fg"
  - "away_f_pl_is_form"

  # Match context
  - "home_f_match_state"
  - "away_f_match_state"

# Гиперпараметры CatBoost
params:
  loss_function: "Logloss"
  eval_metric: "Logloss"
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0

  random_seed: 42
  verbose: 100
  allow_writing_files: false

  od_type: "Iter"
  od_wait: 200

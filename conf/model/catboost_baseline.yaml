# Старая базовая модель (для обратной совместимости)
# @package _global_.model

name: "catboost_baseline"
type: "catboost"
description: "Legacy baseline CatBoost model"
save_format: "cbm"

# Конфигурация таргета (для совместимости с is_home_win)
target_config:
  source_key: "is_home_win"
  name: "target"                  # старое имя таргета

# Фичи для этой модели
features:
  - "points_diff_lag1"
  - "points_total_lag1"

# Гиперпараметры CatBoost
params:
  loss_function: "Logloss"
  eval_metric: "AUC"
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0

  random_seed: 42
  verbose: 100
  allow_writing_files: false

  od_type: "Iter"
  od_wait: 200


# ============================================================================
# DVC Pipeline: Data Processing + Production Workflow
# ============================================================================
#
# Основной pipeline (dvc repro):
#   ingest → clean → features → validate
#
# Production workflow (запускается вручную):
#   dvc repro train_prod      — обучение продакшен модели
#   dvc repro materialize     — материализация предсказаний
#
# Параметризация (params.yaml):
#   features.config — набор фичей (basic / advanced)
#   prod.*          — конфигурация для продакшен обучения

stages:
  # ========================================================================
  # DATA PIPELINE (автоматический, запускается через dvc repro)
  # ========================================================================

  # Шаг 1: Ingest (source → raw)
  # Читает CSV, разделяет на подтурниры, извлекает odds
  ingest:
    cmd: uv run python -m sports_forecast.data.ingest
    deps:
      - sports_forecast/data/ingest.py
      - conf/source/
      - conf/bookmaker/
      - data/source/
    outs:
      - data/raw/:
          cache: true
          persist: true

  # Шаг 2: Clean (raw → interim)
  # Очистка, типизация, валидация (Pandera), генерация derived_columns
  clean:
    cmd: uv run python -m sports_forecast.data.clean
    deps:
      - sports_forecast/data/clean.py
      - sports_forecast/validation/schemas.py
      - conf/tournament/
      - conf/sport/
      - conf/paths.yaml
      - data/raw/
    outs:
      - data/interim/:
          cache: true
          persist: true

  # Шаг 3: Features (interim → processed)
  # Генерация фичей, набор определяется параметром features.config
  features:
    cmd: >-
      uv run python -m sports_forecast.features.features_build --multirun
      tournament=uel_kz_1,uel_kz_2,uel_cz,lp_ru,lp_eu,lp_eu_a18,lp_by
      features=${features.config}
    params:
      - features.config
    deps:
      - sports_forecast/features/features_build.py
      - sports_forecast/features/pipeline.py
      - sports_forecast/features/generators/
      - conf/features/
      - conf/features_pipeline.yaml
      - conf/paths.yaml
      - data/interim/
    outs:
      - data/processed/:
          cache: true
          persist: true

  # Шаг 4: Validate (проверка качества данных)
  # Pandera validation на всех слоях данных
  validate:
    cmd: uv run python -m sports_forecast.validation.run_validation
    deps:
      - sports_forecast/validation/run_validation.py
      - sports_forecast/validation/schemas.py
      - sports_forecast/validation/gates.py
      - data/raw/
      - data/interim/
      - data/processed/

  # ========================================================================
  # PRODUCTION WORKFLOW (запускается вручную)
  # ========================================================================
  # Использование:
  #   dvc repro train_prod       — обучить production модель
  #   dvc repro materialize      — материализовать предсказания
  #
  # Параметры берутся из params.yaml (секция prod.*)
  # Для смены турнира/алгоритма отредактируйте params.yaml

  # Шаг 5: Train production model
  # Обучение одной prod модели с логированием в MLflow
  train_prod:
    cmd: >-
      uv run python -m sports_forecast.train
      tournament=${prod.tournament}
      market=${prod.market}
      market_spec=${prod.market_spec}
      algorithm=${prod.algorithm}
      features=${prod.features}
    params:
      - prod.tournament
      - prod.market
      - prod.market_spec
      - prod.algorithm
      - prod.features
    deps:
      - sports_forecast/train.py
      - sports_forecast/training/trainer.py
      - conf/algorithm/
      - conf/features/
      - data/processed/
    outs:
      - models/${prod.tournament}/${prod.market_spec}/:
          cache: true
          persist: true

  # Шаг 6: Materialize predictions
  # Batch inference на upcoming матчах → запись в DB
  materialize:
    cmd: >-
      uv run python -m sports_forecast.materialize
      tournament=${prod.tournament}
      market=${prod.market}
      market_spec=${prod.market_spec}
      algorithm=${prod.algorithm}
      features=${prod.features}
    params:
      - prod.tournament
      - prod.market
      - prod.market_spec
      - prod.algorithm
      - prod.features
    deps:
      - sports_forecast/materialize.py
      - models/${prod.tournament}/${prod.market_spec}/
      - data/processed/

# ============================================================================
# ЭКСПЕРИМЕНТАЛЬНОЕ ОБУЧЕНИЕ
# ============================================================================
# Для экспериментов (sweep, multirun, Optuna) используйте CLI напрямую:
#
#   make train-sweep TOURNAMENT=uel_kz_1
#   make train-sweep-full TOURNAMENT=uel_kz_1
#
#   uv run python -m sports_forecast.train --multirun \
#       tournament=uel_kz_1 algorithm=catboost,lgbm features=basic,advanced
#
# Airflow DAGs также запускают обучение через CLI (не через DVC).

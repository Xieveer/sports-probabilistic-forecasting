stages:
  ingest:
    cmd: uv run python -m sports_forecast.data.ingest
    deps:
      - sports_forecast/data/ingest.py
      - data/source
    outs:
      - data/raw

  clean:
    cmd: uv run python -m sports_forecast.data.clean
    deps:
      - sports_forecast/data/clean.py
      - conf/tournament
      - conf/paths.yaml
      - data/raw
    outs:
      - data/interim

  features:
    cmd: uv run python -m sports_forecast.features.features_build tournament=all model=is_home_win
    deps:
      - sports_forecast/features/features_build.py
      - conf/features
      - conf/paths.yaml
      - data/interim
    outs:
      - data/processed

  train:
    cmd: uv run python -m sports_forecast.train tournament=uel_kz_1 market=total market_spec=total_over market_spec.line=6.5 recipe=total_baseline features=basic algorithm=dummy
    deps:
      - sports_forecast/train.py
      - sports_forecast/training/
      - conf/config.yaml
      - conf/paths.yaml
      - conf/tournament
      - conf/algorithm
      - conf/market
      - conf/market_spec
      - conf/recipe
      - data/processed
    outs:
      - models

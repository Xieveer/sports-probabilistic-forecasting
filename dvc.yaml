# ============================================================================
# DVC Pipeline: Data Processing + Production Workflow
# ============================================================================
#
# Основной pipeline (dvc repro):
#   ingest → clean → features → validate
#
# Обучение и inference — через CLI / Airflow (не через DVC).
# См. комментарии в конце файла.
#
# Параметризация (params.yaml):
#   features.config — набор фичей (basic / advanced)

stages:
  # ========================================================================
  # DATA PIPELINE (автоматический, запускается через dvc repro)
  # ========================================================================

  # Шаг 1: Ingest (source → raw)
  # Читает CSV, разделяет на подтурниры, извлекает odds
  # NHL: провайдер nhl_web_api (conf/source/nhl.yaml) пишет data/source/nhl/source.csv;
  # Football: smart_tables_api → data/source/football_nationals/source.csv;
  # этап features включает football_nationals при наличии interim (R44).
  ingest:
    cmd: uv run python -m sports_forecast.data.ingest
    deps:
      - sports_forecast/data/ingest.py
      - sports_forecast/data/providers/smart_tables/
      - conf/source/
      - conf/bookmaker/
      - data/source/
    outs:
      - data/raw/:
          cache: true
          persist: true

  # Шаг 2: Clean (raw → interim)
  # Очистка, типизация, валидация (Pandera), генерация derived_columns
  clean:
    cmd: uv run python -m sports_forecast.data.clean
    deps:
      - sports_forecast/data/clean.py
      - sports_forecast/validation/schemas.py
      - conf/tournament/
      - conf/sport/
      - conf/paths.yaml
      - docs/cursor/source_data/football.md
      - data/raw/
    outs:
      - data/interim/:
          cache: true
          persist: true

  # Шаг 3: Features (interim → processed)
  # Генерация фичей, набор определяется параметром features.config
  features:
    cmd: >-
      uv run python -m sports_forecast.features.features_build --multirun
      tournament=uel_kz_1,uel_kz_2,uel_cz,lp_ru,lp_eu,lp_eu_a18,lp_by,nhl,football_nationals
      features=${features.config}
    params:
      - features.config
    deps:
      - sports_forecast/features/features_build.py
      - sports_forecast/features/pipeline.py
      - sports_forecast/features/rolling_contexts.py
      - sports_forecast/features/feature_pipeline_compose.py
      - sports_forecast/features/generators/
      - conf/features/
      - conf/features_pipeline.yaml
      - conf/paths.yaml
      - data/interim/
    outs:
      - data/processed/:
          cache: true
          persist: true

  # Шаг 4: Validate (проверка качества данных)
  # Pandera validation на всех слоях данных
  validate:
    cmd: uv run python -m sports_forecast.validation.run_validation
    deps:
      - sports_forecast/validation/run_validation.py
      - sports_forecast/validation/schemas.py
      - sports_forecast/validation/gates.py
      - data/raw/
      - data/interim/
      - data/processed/

# ============================================================================
# ОБУЧЕНИЕ И INFERENCE — вне DVC
# ============================================================================
# Обучение и материализация НЕ входят в dvc repro.
# DVC управляет только данными (source → raw → interim → processed).
#
# Обучение (эксперименты):
#   make train-sweep TOURNAMENT=uel_kz_1
#   uv run python -m sports_forecast.train --multirun \
#       tournament=uel_kz_1 algorithm=catboost,lgbm features=basic,advanced
#
# Обучение (prod модель):
#   uv run python -m sports_forecast.train \
#       tournament=uel_kz_1 algorithm=catboost features=advanced
#
# Материализация предсказаний:
#   uv run python -m sports_forecast.materialize \
#       tournament=uel_kz_1 algorithm=catboost features=advanced
#
# В production всё оркестрируется через Airflow DAGs:
#   dag_data_refresh  → dvc repro (данные)
#   dag_training      → CLI train + promote (модели)
#   dag_materialize   → CLI materialize (предсказания → DB)
#   dag_monitoring    → drift + performance checks

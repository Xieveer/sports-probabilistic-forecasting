stages:
  ingest:
    cmd: uv run python -m sports_forecast.data.ingest
    deps:
      - sports_forecast/data/ingest.py
      - data/source
    outs:
      - data/raw

  clean:
    cmd: uv run python -m sports_forecast.data.clean
    deps:
      - sports_forecast/data/clean.py
      - conf/tournament
      - conf/paths.yaml
      - data/raw
    outs:
      - data/interim

  features:
    cmd: uv run python -m sports_forecast.features.features_build tournament=all model=is_home_win
    deps:
      - sports_forecast/features/features_build.py
      - conf/features
      - conf/paths.yaml
      - data/interim
    outs:
      - data/processed

  train:
    cmd: uv run python -m sports_forecast.train_v2 model=single/catboost tournament=all
    deps:
      - sports_forecast/train_v2.py
      - sports_forecast/training/
      - conf/config.yaml
      - conf/paths.yaml
      - conf/tournament
      - conf/model
      - data/processed
    outs:
      - models

# ─────────────────────────────────────────────────────────────────
# Docker Compose for Sports Probabilistic Forecasting
#
# Services:
#   db       — PostgreSQL for prediction store + Airflow metadata
#   api      — FastAPI read-only prediction server
#   mlflow   — MLflow tracking server
#   worker   — batch prediction materialization (on-demand)
#
# Airflow (дополнительно):
#   docker compose -f docker-compose.yml -f airflow/docker-compose.airflow.yml up -d
# ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_forecast
      POSTGRES_USER: sf_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sf_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./airflow/init-airflow-db.sh:/docker-entrypoint-initdb.d/init-airflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf_user -d sports_forecast"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI prediction server ─────────────────────────────────
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://sf_user:${POSTGRES_PASSWORD:-sf_dev_password}@db:5432/sports_forecast"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./conf:/app/conf:ro

  telegram-bot:
    profiles: ["bot"]
    build:
      context: .
      target: telegram-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set_BOT_TOKEN}
      BOT_ALLOWED_USER_IDS: ${BOT_ALLOWED_USER_IDS:-}
      BOT_ADMIN_USER_IDS: ${BOT_ADMIN_USER_IDS:-}
      BOT_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./conf:/app/conf:ro
      - ./models:/app/models:ro

  # ── MLflow tracking server ───────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: "postgresql://sf_user:${POSTGRES_PASSWORD:-sf_dev_password}@db:5432/sports_forecast"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlflow/artifacts"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://sf_user:${POSTGRES_PASSWORD:-sf_dev_password}@db:5432/sports_forecast
        --default-artifact-root /mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  # ── Worker: batch prediction materialization ──────────────────
  # Запускается on-demand: docker compose run worker <command>
  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: "postgresql://sf_user:${POSTGRES_PASSWORD:-sf_dev_password}@db:5432/sports_forecast"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./conf:/app/conf:ro
    profiles:
      - worker  # Не запускается автоматически

  # ── Prometheus ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      api:
        condition: service_started

  # ── Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pg_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

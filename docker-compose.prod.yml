# Минимальный production serving-контур. Запускать этот файл самостоятельно:
#   docker compose -f docker-compose.prod.yml up -d
#
# В состав входят только API, PostgreSQL, Telegram bot, Caddy и одноразовый
# Worker. Airflow, MLflow, DVC, Prometheus, Grafana и node-exporter остаются
# вне production Compose. Alloy управляется инфраструктурным репозиторием.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_forecast
      POSTGRES_USER: sf_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf_user -d sports_forecast"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 1536m
    shm_size: 256mb
    logging: &prod_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${SF_API_IMAGE:?set SF_API_IMAGE to an immutable ghcr image digest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sf_user:${POSTGRES_PASSWORD}@db:5432/sports_forecast
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - runtime_models:/app/models:ro
    cpus: "1.5"
    mem_limit: 1536m
    logging: *prod_logging

  telegram-bot:
    image: ${SF_BOT_IMAGE:?set SF_BOT_IMAGE to an immutable ghcr image digest}
    pull_policy: always
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      BOT_ALLOWED_USER_IDS: ${BOT_ALLOWED_USER_IDS:-}
      BOT_ADMIN_USER_IDS: ${BOT_ADMIN_USER_IDS:-}
      BOT_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    volumes:
      - runtime_models:/app/models:ro
    cpus: "0.5"
    mem_limit: 384m
    logging: *prod_logging

  worker:
    image: ${SF_WORKER_IMAGE:?set SF_WORKER_IMAGE to an immutable ghcr image digest}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://sf_user:${POSTGRES_PASSWORD}@db:5432/sports_forecast
      SF_WORKER_RUN_ID: ${SF_WORKER_RUN_ID:?set a scheduler-generated id}
      SF_MODEL_RUNTIME_ROOT: /app/models
      SF_APP_VERSION: ${SF_APP_VERSION:?set SF_APP_VERSION}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - runtime_models:/app/models:ro
      - runtime_data:/app/data
      - serving_data:/app/serving-data:ro
    profiles: ["worker"]
    cpus: "2.0"
    mem_limit: 2048m
    logging: *prod_logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SF_API_DOMAIN: ${SF_API_DOMAIN:?set SF_API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    cpus: "0.25"
    mem_limit: 128m
    logging: *prod_logging

volumes:
  pg_data:
  runtime_models:
  runtime_data:
  serving_data:
  caddy_data:
  caddy_config:

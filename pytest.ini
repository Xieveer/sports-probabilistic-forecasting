[pytest]
# Конфигурация pytest для Sports Probabilistic Forecasting

# Директории с тестами
testpaths = tests

# Паттерн для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции запуска
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Минимальная версия pytest
minversion = 7.0

# Маркеры для категоризации тестов
markers =
    unit: Unit tests (быстрые, изолированные)
    integration: Integration tests (медленные, требуют данных)
    slow: Медленные тесты
    requires_data: Тесты, требующие реальных данных
    requires_model: Тесты, требующие обученной модели

# Покрытие кода (если используется pytest-cov)
# --cov=sports_forecast
# --cov-report=html
# --cov-report=term-missing


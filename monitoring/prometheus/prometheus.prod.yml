# Production Prometheus: base scrape targets + node exporter (host disk).
# Mount in docker-compose.prod (replaces dev prometheus.yml for prod stack).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "sports-forecast-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "sports-forecast"
          component: "api"

  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]
        labels:
          service: "sports-forecast"
          component: "mlflow"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "sports-forecast"
          component: "node"

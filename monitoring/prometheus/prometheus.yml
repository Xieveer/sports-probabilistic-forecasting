# Prometheus Configuration for Sports Forecast
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Добавить alertmanager если нужно

scrape_configs:
  # FastAPI application metrics
  - job_name: "sports-forecast-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "sports-forecast"
          component: "api"

  # MLflow server (если добавить prometheus exporter)
  - job_name: "mlflow"
    static_configs:
      - targets: ["mlflow:5000"]
        labels:
          service: "sports-forecast"
          component: "mlflow"

  # PostgreSQL exporter (опционально)
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

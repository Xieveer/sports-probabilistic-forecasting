# Prometheus Alert Rules for Sports Forecast

groups:
  - name: model_degradation
    rules:
      # AUC dropped below threshold
      - alert: ModelAUCDegraded
        expr: sf_model_auc < 0.55
        for: 1h
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "Model AUC degradation detected"
          description: >
            Model AUC for {{ $labels.tournament }}/{{ $labels.market_spec }}
            dropped to {{ $value | printf "%.4f" }}.
            Threshold: 0.55.

      # LogLoss spiked
      - alert: ModelLogLossHigh
        expr: sf_model_logloss > 0.75
        for: 1h
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "Model LogLoss is too high"
          description: >
            LogLoss for {{ $labels.tournament }}/{{ $labels.market_spec }}
            is {{ $value | printf "%.4f" }}.

      # ECE high (miscalibrated)
      - alert: ModelECEHigh
        expr: sf_model_ece > 0.15
        for: 1h
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "Model ECE is high (miscalibrated)"
          description: >
            ECE for {{ $labels.tournament }}/{{ $labels.market_spec }}
            is {{ $value | printf "%.4f" }}. Consider recalibration.

  - name: data_drift
    rules:
      # Significant data drift
      - alert: DataDriftSignificant
        expr: sf_drift_score > 0.25
        for: 30m
        labels:
          severity: critical
          component: data
        annotations:
          summary: "Significant data drift detected"
          description: >
            Feature {{ $labels.feature }} for {{ $labels.tournament }}
            has PSI {{ $value | printf "%.4f" }} (threshold: 0.25).

      # Prediction distribution drift
      - alert: PredictionDrift
        expr: sf_prediction_drift > 0.20
        for: 30m
        labels:
          severity: warning
          component: ml
        annotations:
          summary: "Prediction distribution drift"
          description: >
            Prediction PSI for {{ $labels.tournament }}/{{ $labels.market_spec }}
            is {{ $value | printf "%.4f" }}.

  - name: api_slo
    rules:
      - alert: HighPredictionLatencyP99
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(sf_model_prediction_latency_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Высокая латентность предсказаний (p99)"
          description: >
            p99 sf_model_prediction_latency_seconds за 5m превышает 1s.
            Проверьте нагрузку, БД и размер батчей.

      - alert: PredictionMaterializeStale
        expr: (time() - max(sf_model_last_materialize_timestamp)) > 43200
        for: 1h
        labels:
          severity: warning
          component: data
        annotations:
          summary: "Давно не было материализации предсказаний"
          description: >
            max(sf_model_last_materialize_timestamp) старше 12 ч. Запустите refresh/materialize
            или проверьте cron / Airflow.

      - alert: RootDiskLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!="",mountpoint="/"}
            /
            node_filesystem_size_bytes{fstype!="",mountpoint="/"}
          ) < 0.10
        for: 30m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Мало места на корневом разделе хоста"
          description: >
            Свободно <10% на mountpoint=/ (node_exporter). Очистите диск или расширьте volume.

  - name: system_health
    rules:
      # No predictions served for too long
      - alert: NoPredictions
        expr: increase(sf_model_predictions_total[1h]) == 0
        for: 2h
        labels:
          severity: warning
          component: system
        annotations:
          summary: "No predictions served"
          description: "No predictions have been served in the last 2 hours."

      # Model not retrained recently
      - alert: ModelStale
        expr: (time() - sf_model_last_retrained_timestamp) > 604800  # 7 days
        for: 1h
        labels:
          severity: info
          component: ml
        annotations:
          summary: "Model has not been retrained for 7+ days"
          description: >
            Model {{ $labels.tournament }}/{{ $labels.market_spec }}
            last retrained {{ $value | humanizeDuration }} ago.

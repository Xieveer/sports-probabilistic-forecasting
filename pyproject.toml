[project]
name = "sports-probabilistic-forecasting"
version = "1.1.0"
description = "Probabilistic Forecasting Service for Sports Event Outcomes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost",
    "hydra-core",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "scikit-learn",
    "lightgbm>=4.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.124.0",
    "uvicorn>=0.38.0",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.17.2",
    "pandera>=0.29.0",
    "prometheus-client>=0.24.1",
    "aiogram>=3.15.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sports_forecast*"]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "ruff>=0.14.8",
    "sphinx>=7.3.0",
    "sphinx-autobuild>=2024.4.0",
    "sphinx-rtd-theme>=2.0.0",
    "pytest-cov>=4.0.0",
    "dvc",
    "dvc-s3>=3.2.2",
    "mlflow",
    "optuna>=3.0.0",
]
